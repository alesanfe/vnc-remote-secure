name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ============================================================================
  # LINT (Linux)
  # ============================================================================
  lint-linux:
    name: Lint & Syntax (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Bash syntax check
        run: |
          bash -n vnc-remote
          bash -n src/rpi-vnc-remote.sh
          find scripts/ -name '*.sh' -exec bash -n {} \;
      - name: ShellCheck (errors only)
        run: |
          find src/ scripts/ -name '*.sh' -exec shellcheck -S error {} \;
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Ruff (Python lint)
        run: |
          pip install ruff
          ruff check src/vnc_remote_secure/ tools/ scripts/utilities/
      - name: Python compile all
        run: |
          python -m compileall src/vnc_remote_secure/ -q

  lint-windows:
    name: Lint (Windows - PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run PSScriptAnalyzer
        shell: pwsh -NoProfile
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeDefaultRules
          if ($results) {
            $results | Format-Table
            $errors = $results | Where-Object Severity -eq 'Error'
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
              exit 1
            }
          }
          Write-Host "PSScriptAnalyzer: no errors found"

  # ============================================================================
  # PYTHON TESTS (matrix: Ubuntu + Windows, Python 3.11/3.12/3.13)
  # ============================================================================
  python-tests:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run pytest
        # Coverage gate on one matrix leg only — measuring on every
        # OS×Python cell triples the upload surface for no signal.
        # --cov-fail-under enforces the floor (measured baseline: 55%
        # after the landing/audio/certs/health test rounds; raise as
        # coverage improves — next targets: novnc.py 27%, d3des.py 46%).
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pytest tests/unit tests/integration tests/e2e tests/security -q \
            --cov=vnc_remote_secure --cov-report=term-missing \
            --cov-report=xml:coverage.xml --cov-fail-under=55
      - name: Run pytest (no coverage gate)
        if: !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12')
        run: |
          python -m pytest tests/unit tests/integration tests/e2e tests/security -q
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================================================
  # BASH TEST PYRAMID (Linux)
  # ============================================================================
  bash-tests:
    name: Bash Test Pyramid (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run Bash test pyramid
        run: |
          bash tests/run_tests.sh

  # ============================================================================
  # PESTER TESTS (Windows, -NoProfile)
  # ============================================================================
  pester-tests:
    name: Pester Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pester
        shell: pwsh -NoProfile
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester tests
        shell: pwsh -NoProfile
        run: |
          $results = @()
          $failed = 0
          foreach ($dir in @('tests/powershell', 'tests/windows')) {
            if (Test-Path $dir) {
              Write-Host "Running Pester tests in $dir"
              $r = Invoke-Pester -Path $dir -Output Detailed -PassThru
              $results += $r
              if ($r.FailedCount -gt 0) { $failed += $r.FailedCount }
            } else {
              Write-Host "No Pester tests directory found at $dir"
            }
          }
          if ($results.Count -gt 0) {
            $results | Export-Clixml -Path pester-results.xml
          }
          if ($failed -gt 0) {
            Write-Host "$failed Pester test(s) failed"
            exit 1
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pester-results
          path: pester-results.xml

  # ============================================================================
  # SECURITY SCANS (Bandit, Semgrep)
  # ============================================================================
  security-scan:
    name: Security Scan (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      # Informational-only: findings are uploaded as artifacts but do not
      # gate the pipeline. Bandit's medium/low findings include accepted
      # patterns here (RFB DES is protocol-mandated; 0.0.0.0 binds are
      # profile-driven); flip to gating once the backlog is triaged.
      - name: Run Bandit (informational)
        run: |
          bandit -r src/vnc_remote_secure/ -f json -o bandit-report.json || true
          bandit -r src/vnc_remote_secure/ -ll || true
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep (informational)
        run: |
          semgrep scan --config=auto --error src/vnc_remote_secure/ || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ============================================================================
  # DEPENDENCY REVIEW (block PRs introducing vulnerable deps)
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: moderate

  # ============================================================================
  # CLEAN INSTALL TEST (verify the project installs from scratch)
  # ============================================================================
  install-test:
    name: Clean Install Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Clean install
        run: |
          pip install -e ".[dev]"
      - name: Verify CLI works
        run: |
          python -m vnc_remote_secure.cli version
          python -m vnc_remote_secure.cli help
