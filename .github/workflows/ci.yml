name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # LINT (Linux + Windows in parallel)
  # ============================================================================
  lint-linux:
    name: Lint & Syntax (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Bash syntax check
        run: |
          bash -n vnc-remote
          bash -n src/rpi-vnc-remote.sh
          find src/lib/ -name '*.sh' -exec bash -n {} \;
          find scripts/ -name '*.sh' -exec bash -n {} \;
      - name: ShellCheck (errors only)
        run: |
          find src/ scripts/ -name '*.sh' -exec shellcheck -S error {} \;
      - name: Python compile
        run: |
          python3 -m py_compile src/vnc_remote_secure/core/config.py
          python3 -m py_compile src/vnc_remote_secure/vendor/d3des.py
          python3 -m py_compile src/vnc_remote_secure/cli.py
      - name: Ruff (Python lint)
        run: |
          pip install ruff
          ruff check src/vnc_remote_secure/ || true
      - name: shfmt check
        run: |
          go install github.com/mvdan/sh@latest
          ~/go/bin/sh -version || true

  lint-windows:
    name: Lint (Windows - PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeDefaultRules
          if ($results) {
            $results | Format-Table
            $errors = $results | Where-Object Severity -eq 'Error'
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
              exit 1
            }
          }
          Write-Host "PSScriptAnalyzer: no errors found"

  # ============================================================================
  # UNIT TESTS (Linux)
  # ============================================================================
  unit-tests:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash test pyramid
        run: |
          bash tests/run_tests.sh

  # ============================================================================
  # WINDOWS TESTS (Pester)
  # ============================================================================
  windows-tests:
    name: Windows Tests (Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester tests
        shell: pwsh
        run: |
          if (Test-Path tests/windows) {
            Invoke-Pester -Path tests/windows -Output Detailed -PassThru | Export-Clixml -Path pester-results.xml
          } elseif (Test-Path tests/powershell) {
            Invoke-Pester -Path tests/powershell -Output Detailed -PassThru | Export-Clixml -Path pester-results.xml
          } else {
            Write-Host "No Windows tests directory found"
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml
