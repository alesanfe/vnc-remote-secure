name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ============================================================================
  # LINT (Linux)
  # ============================================================================
  lint-linux:
    name: Lint & Syntax (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Bash syntax check
        run: |
          bash -n vnc-remote
          bash -n src/rpi-vnc-remote.sh
          find src/lib/ -name '*.sh' -exec bash -n {} \;
          find scripts/ -name '*.sh' -exec bash -n {} \;
      - name: ShellCheck (errors only)
        run: |
          find src/ scripts/ -name '*.sh' -exec shellcheck -S error {} \;
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff (Python lint)
        run: |
          pip install ruff
          ruff check src/vnc_remote_secure/
      - name: Python compile all
        run: |
          python -m compileall src/vnc_remote_secure/ -q

  lint-windows:
    name: Lint (Windows - PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh -NoProfile
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeDefaultRules
          if ($results) {
            $results | Format-Table
            $errors = $results | Where-Object Severity -eq 'Error'
            if ($errors) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)"
              exit 1
            }
          }
          Write-Host "PSScriptAnalyzer: no errors found"

  # ============================================================================
  # PYTHON TESTS (matrix: Ubuntu + Windows, Python 3.11/3.12/3.13)
  # ============================================================================
  python-tests:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run pytest
        run: |
          python -m pytest tests/unit tests/security -q

  # ============================================================================
  # BASH TEST PYRAMID (Linux)
  # ============================================================================
  bash-tests:
    name: Bash Test Pyramid (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash test pyramid
        run: |
          bash tests/run_tests.sh

  # ============================================================================
  # PESTER TESTS (Windows, -NoProfile)
  # ============================================================================
  pester-tests:
    name: Pester Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh -NoProfile
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run Pester tests
        shell: pwsh -NoProfile
        run: |
          if (Test-Path tests/powershell) {
            Invoke-Pester -Path tests/powershell -Output Detailed -PassThru | Export-Clixml -Path pester-results.xml
          } else {
            Write-Host "No Pester tests directory found"
          }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml

  # ============================================================================
  # SECURITY SCANS (Bandit, Semgrep, CodeQL)
  # ============================================================================
  security-scan:
    name: Security Scan (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: |
          bandit -r src/vnc_remote_secure/ -f json -o bandit-report.json || true
          bandit -r src/vnc_remote_secure/ -ll || true
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --error src/vnc_remote_secure/ || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ============================================================================
  # DEPENDENCY REVIEW (block PRs introducing vulnerable deps)
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  # ============================================================================
  # CLEAN INSTALL TEST (verify the project installs from scratch)
  # ============================================================================
  install-test:
    name: Clean Install Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean install
        run: |
          pip install -e ".[dev]"
      - name: Verify CLI works
        run: |
          python -m vnc_remote_secure.cli version
          python -m vnc_remote_secure.cli help
