name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # INTEGRATION TESTS (Linux)
  # ============================================================================
  integration-linux:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: python -m pytest tests/integration -q

  # ============================================================================
  # E2E TESTS (Linux)
  # ============================================================================
  e2e-linux:
    name: E2E Tests (Linux)
    runs-on: ubuntu-latest
    needs: [integration-linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run E2E tests
        run: python -m pytest tests/e2e -q

  # ============================================================================
  # BROWSER E2E TESTS (Playwright)
  # ============================================================================
  browser-e2e:
    name: Browser E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-linux]
    env:
      # Shared by the spawned webServers (they inherit process env) and
      # by the spec (it reads LANDING_PASSWORD for HTTP Basic creds).
      # The portal is fail-closed — without this every request is 401.
      LANDING_PASSWORD: ci-test-password
      HEALTH_WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
