name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least-privilege default — jobs needing more declare it explicitly.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================================================
  # INTEGRATION TESTS (Linux)
  # ============================================================================
  integration-linux:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: python -m pytest tests/integration -q

  # ============================================================================
  # E2E TESTS (Linux)
  # ============================================================================
  e2e-linux:
    name: E2E Tests (Linux)
    runs-on: ubuntu-latest
    needs: [integration-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run E2E tests
        run: python -m pytest tests/e2e -q

  # ============================================================================
  # BROWSER E2E TESTS (Playwright)
  # ============================================================================
  browser-e2e:
    name: Browser E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-linux]
    env:
      # Shared by the spawned webServers (they inherit process env) and
      # by the spec (it reads LANDING_PASSWORD for HTTP Basic creds).
      # The portal is fail-closed — without this every request is 401.
      # NOTE: must satisfy validate_password() (no weak patterns like
      # "password", needs upper+lower+digit+special) or the spawned
      # landing service exits immediately and webServer times out.
      LANDING_PASSWORD: 'E2e-Landing!Passw0rd'
      HEALTH_WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
