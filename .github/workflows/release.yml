name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ============================================================================
  # BUILD - Create release artifacts
  # ============================================================================
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          pip install build wheel
      - name: Build package
        run: |
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  # ============================================================================
  # SBOM - Generate Software Bill of Materials
  # ============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json

  # ============================================================================
  # CHECKSUMS - Generate SHA-256 checksums for all artifacts
  # ============================================================================
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [build, sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.json" \) -exec sha256sum {} \; > checksums-sha256.txt
          cat checksums-sha256.txt
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: artifacts/checksums-sha256.txt

  # ============================================================================
  # VERIFY - Verify release artifacts before publishing
  # ============================================================================
  verify:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: [build, sbom, checksums]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Verify artifacts
        run: python scripts/release/verify-release.py

  # ============================================================================
  # RELEASE - Create GitHub Release with signed artifacts
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sbom, checksums, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/dist-ubuntu-latest/*
            artifacts/dist-windows-latest/*
            artifacts/sbom/sbom.spdx.json
            artifacts/sbom/sbom.cyclonedx.json
            artifacts/checksums/checksums-sha256.txt
