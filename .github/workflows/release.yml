name: Release

on:
  push:
    tags: ['v*']

# Least-privilege default — build/attest/publish jobs declare their
# own permissions explicitly below.
permissions:
  contents: read

jobs:
  # ============================================================================
  # BUILD - Create release artifacts
  # ============================================================================
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          pip install build wheel
      - name: Build package
        run: |
          python -m build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  # ============================================================================
  # SBOM - Generate Software Bill of Materials
  # ============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json

  # ============================================================================
  # CHECKSUMS - Generate SHA-256 checksums for all artifacts
  # ============================================================================
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [build, sbom]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "*.json" \) -exec sha256sum {} \; > checksums-sha256.txt
          cat checksums-sha256.txt
      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/checksums-sha256.txt

  # ============================================================================
  # VERIFY - Verify release artifacts before publishing
  # ============================================================================
  verify:
    name: Verify Release Artifacts
    runs-on: ubuntu-latest
    needs: [build, sbom, checksums]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Verify artifacts
        run: python scripts/release/verify-release.py

  # ============================================================================
  # SIGN - cosign keyless (OIDC) signatures for every artifact
  # ============================================================================
  sign:
    name: Sign Artifacts (cosign keyless)
    runs-on: ubuntu-latest
    needs: [build, sbom, checksums, verify]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Install cosign
        uses: sigstore/cosign-installer@dc87c2b39459b28e9345f6b6edc2da40ef3b94de # v3
      - name: Sign artifacts (keyless, Rekor-logged)
        run: |
          cd artifacts
          find . -type f \( -name "*.whl" -o -name "*.tar.gz" \
            -o -name "*.txt" -o -name "*.json" \) -print0 | \
          while IFS= read -r -d '' f; do
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" "$f"
          done
      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            artifacts/**/*.sig
            artifacts/**/*.pem

  # ============================================================================
  # PUBLISH - PyPI trusted publishing (OIDC, no API token)
  # ============================================================================
  # Requires a one-time PyPI setup: project page ->
  # "Publishing" -> add this repo + this workflow filename as a
  # trusted publisher. Until then this job fails visibly — which is
  # correct: `vnc-remote upgrade` without a PyPI channel only works
  # via `--from`.
  publish:
    name: Publish to PyPI (trusted publisher)
    runs-on: ubuntu-latest
    needs: [build, verify]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-ubuntu-latest
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9a8b1c9f0ac03f3b4a0f96ffa62 # release/v1
        with:
          attestations: 'true'   # sigstore attestations alongside cosign sigs
          verbose: 'true'

  # ============================================================================
  # RELEASE - Create GitHub Release with signed artifacts
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, sbom, checksums, verify, sign]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/dist-ubuntu-latest/*
            artifacts/dist-windows-latest/*
            artifacts/sbom/sbom.spdx.json
            artifacts/sbom/sbom.cyclonedx.json
            artifacts/checksums/checksums-sha256.txt
            artifacts/signatures/**/*.sig
            artifacts/signatures/**/*.pem
