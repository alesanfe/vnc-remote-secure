# Pre-commit hooks for VNC Remote Secure
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ============================================================================
  # Upstream hygiene hooks (replace hand-rolled CRLF/whitespace/
  # merge-marker greps)
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml       # safe_load — syntax + duplicate keys
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        types_or: [shell, python, yaml, markdown]
      - id: mixed-line-ending
        args: ["--fix=no"]
        types_or: [shell, python, yaml, markdown]
      - id: check-merge-conflict

  # ============================================================================
  # Local hooks (fast, no external deps)
  # ============================================================================
  - repo: local
    hooks:
      - id: no-secrets-in-env
        name: Check .env is not staged
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -q "^\.env$"; then echo "ERROR - .env is staged. Unstage it with: git reset HEAD .env"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: python-compile
        name: Python syntax check
        entry: python -m py_compile
        language: system
        files: \.py$
        require_serial: true

      - id: bash-syntax
        name: Bash syntax check
        entry: bash -n
        language: system
        files: \.sh$
        require_serial: true

  # ============================================================================
  # Shell linting
  # ============================================================================
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--exclude=SC1091,SC2034,SC2155"]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.9.0
    hooks:
      # -i 4 = 4 spaces (matches .editorconfig and scripts/development/format.sh)
      - id: shfmt
        args: ["-i", "4", "-ci", "-bn"]

  # ============================================================================
  # Python linting and formatting
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: \.py$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: \.py$
        args: ["--line-length=100"]

  # ============================================================================
  # YAML linting
  # ============================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d", "{rules: {line-length: disable}}"]

  # ============================================================================
  # Extended linting (verified during the 2024 linter sweep)
  # ============================================================================
  - repo: local
    hooks:
      - id: bandit
        name: Bandit security scan
        entry: python -m bandit -q -r --configfile pyproject.toml src/vnc_remote_secure/
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
        args: []

      - id: pydocstyle
        name: pydocstyle (PEP 257)
        entry: python -m pydocstyle
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

      - id: codespell
        name: codespell
        entry: codespell --ignore-words-list="nd,recomend,uptodate,potencial,requiere,ignora,comando,funcional,hace,viceversa" -S "*.min.js,docs/reports/*,third_party/*,node_modules/*,novnc/*"
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-pyproject
        name: Validate pyproject.toml
        entry: validate-pyproject pyproject.toml
        language: system
        files: pyproject\.toml$

      - id: darglint
        name: darglint docstring check
        entry: python -m darglint -v 2
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

  # ============================================================================
  # Secrets detection (Yelp detect-secrets, baseline-driven)
  # ============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: .secrets.baseline

  # ============================================================================
  # Architecture + project rules (local; skip if tools not installed)
  # ============================================================================
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (engine layering contracts)
        entry: bash -c 'command -v lint-imports >/dev/null && lint-imports || echo "lint-imports not installed — skipping"'
        language: system
        files: ^(src/.*\.py|pyproject\.toml)$
        pass_filenames: false

      - id: semgrep-project
        name: Semgrep project rules (.semgrep.yml)
        entry: bash -c 'command -v semgrep >/dev/null && semgrep scan --config .semgrep.yml --metrics=off --error src/ frontend/src/ || echo "semgrep not installed — skipping"'
        language: system
        files: ^(src/.*\.py|frontend/src/.*\.(ts|tsx))$
        pass_filenames: false
