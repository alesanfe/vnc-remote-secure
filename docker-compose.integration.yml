version: '3.8'

services:
  # noVNC service for integration testing
  novnc:
    image: fredrikwallberg/novnc:latest
    ports:
      - "6080:6080"
    environment:
      - VNC_HOST=vnc
      - VNC_PORT=5900
    depends_on:
      - vnc
    networks:
      - vnc-network

  # VNC server for integration testing
  vnc:
    image: danielguerra/ubuntu-xvnc:latest
    ports:
      - "5900:5900"
    environment:
      - DISPLAY=:1
      - VNC_PASSWORD=${VNC_PASSWORD:-testpass123}
    networks:
      - vnc-network

  # ttyd for terminal testing
  ttyd:
    image: tsl0922/ttyd:latest
    ports:
      - "5000:7681"
    command: ttyd -p 7681 bash
    networks:
      - vnc-network

  # Health web server for testing
  health:
    image: python:3.11-slim
    ports:
      - "8080:8080"
    volumes:
      - ./src/lib/monitoring/health_web_server.py:/app/health_web_server.py:ro
    working_dir: /app
    environment:
      - HEALTH_WEB_PORT=8080
      - HEALTH_WEB_HOST=0.0.0.0
      - VNC_PORT=5900
      - NOVNC_PORT=6080
      - TTYD_PORT=7681
    command: python health_web_server.py
    networks:
      - vnc-network

  # nginx reverse proxy for testing
  # Uses an entrypoint script to generate self-signed certs and process
  # the nginx.conf template with envsubst before starting nginx.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCK_DOMAIN=localhost
      - NGINX_HTTP_PORT=80
      - NGINX_HTTPS_PORT=443
      - NOVNC_HOST=novnc
      - NOVNC_PORT=6080
      - TTYD_HOST=ttyd
      - TTYD_PORT=7681
      - HEALTH_WEB_HOST=health
      - HEALTH_WEB_PORT=8080
      - SSL_CERT=/etc/nginx/ssl/fullchain.pem
      - SSL_KEY=/etc/nginx/ssl/privkey.pem
    volumes:
      - ./src/config/nginx.conf:/etc/nginx/template.conf:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      apk add --no-cache openssl gettext &&
      mkdir -p /etc/nginx/ssl &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/nginx/ssl/privkey.pem
      -out /etc/nginx/ssl/fullchain.pem
      -subj "/CN=localhost" &&
      envsubst '$DUCK_DOMAIN $NGINX_HTTP_PORT $NGINX_HTTPS_PORT $NOVNC_HOST $NOVNC_PORT $TTYD_HOST $TTYD_PORT $HEALTH_WEB_HOST $HEALTH_WEB_PORT $SSL_CERT $SSL_KEY'
      < /etc/nginx/template.conf > /etc/nginx/conf.d/default.conf &&
      nginx -g "daemon off;"
    depends_on:
      - novnc
      - ttyd
      - health
    networks:
      - vnc-network

networks:
  vnc-network:
    driver: bridge
