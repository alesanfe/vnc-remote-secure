openapi: 3.0.3
info:
  title: VNC Remote Secure — Admin API
  version: '1.0'
  description: >-
    Versioned administrative API served by the landing service under
    /api/v1/. All responses use the {data, error, request_id} envelope.
    Auth: operator Basic credentials or the vnc_op session cookie;
    ephemeral share-link cookies reach only the routes marked
    x-ephemeral-access: true.
servers:
  - url: /api/v1
# x-servers kept as a deprecated alias — some tooling reads it.
x-servers:
  - url: /api/v1

components:
  securitySchemes:
    operatorBasic:
      type: http
      scheme: basic
    operatorSession:
      type: apiKey
      in: cookie
      name: vnc_op
  schemas:
    Envelope:
      type: object
      required: [data, error, request_id]
      properties:
        data: { nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    ErrorBody:
      type: object
      properties:
        error: { type: boolean }
        message: { type: string }
    SessionSummary:
      type: object
      required:
        - token_id
        - role
        - permissions
        - expires_at
        - single_use
        - view_only
        - no_terminal
        - created_by
        - created_at
        - used
        - revoked
        - max_uses
        - use_count
      properties:
        token_id: { type: string, description: 'Fingerprint, not the token' }
        role: { type: string, enum: [viewer, support, operator, administrator] }
        permissions: { type: array, items: { type: string } }
        expires_at: { type: number }
        single_use: { type: boolean }
        view_only: { type: boolean }
        no_terminal: { type: boolean }
        allowed_ip: { type: string, nullable: true }
        label:
          type: string
          nullable: true
          maxLength: 64
          description: Operator-assigned inventory tag
        created_by: { type: string }
        created_at: { type: number }
        used: { type: boolean }
        revoked: { type: boolean }
        resource: { type: string, nullable: true }
        max_uses: { type: integer }
        use_count: { type: integer }
        last_used_at:
          type: number
          nullable: true
          description: Epoch of the last activation/consumption
        last_used_ip:
          type: string
          nullable: true
          description: Client IP of the last activation
        last_connected_at:
          type: number
          nullable: true
          description: Epoch when a live socket last attached
        last_disconnected_at:
          type: number
          nullable: true
          description: Epoch when the last live socket closed
        connection_count:
          type: integer
          description: Cumulative live connections the grant carried
    AuditEntry:
      type: object
      required: [seq, timestamp, event, user, result, detail]
      properties:
        seq: { type: integer }
        timestamp: { type: string }
        event: { type: string }
        user: { type: string }
        result: { type: string }
        detail: { type: string }
    OperatorSummary:
      type: object
      required: [username, role, disabled, permissions]
      properties:
        username: { type: string }
        role: { type: string }
        disabled: { type: boolean }
        created_at: { type: number, nullable: true }
        permissions: { type: array, items: { type: string } }
    BackupSummary:
      type: object
      required: [name, size, modified, encrypted]
      properties:
        name: { type: string }
        size: { type: integer }
        modified: { type: number }
        encrypted: { type: boolean }
    ConfigEntry:
      type: object
      required: [name, value, source]
      properties:
        name: { type: string }
        value: { type: string, nullable: true }
        source: { type: string }
    SecretRotationResult:
      type: object
      required: [name, fingerprint, env_path, sessions_revoked]
      properties:
        name: { type: string }
        fingerprint: { type: string, description: 'sha256[:8] of the new value — the value itself is NEVER returned' }
        env_path: { type: string }
        sessions_revoked: { type: boolean }
    LifecycleService:
      type: object
      properties:
        pid: { type: integer, nullable: true }
        running: { type: boolean }
        enabled: { type: boolean }
        port: { type: integer, nullable: true }
    # --- Response envelopes (x-response-schema names) ------------------
    # Each is the full {data, error, request_id} envelope with `data`
    # typed to the payload the endpoint actually emits.
    MeResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [authenticated, operator, ephemeral, csrf_token]
          properties:
            authenticated: { type: boolean }
            operator: { $ref: '#/components/schemas/OperatorSummary', nullable: true }
            ephemeral: { type: boolean }
            csrf_token: { type: string, nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    StatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [services]
          properties:
            services: { type: object, additionalProperties: { type: boolean } }
            audio_capture: { type: boolean }
            lan_ips: { type: array, items: { type: string }, description: 'operators only' }
            system: { type: object, description: 'operators only' }
        error: { nullable: true }
        request_id: { type: string }
    SessionContextResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [ephemeral]
          properties:
            ephemeral: { type: boolean }
            active: { type: boolean }
            role: { type: string }
            permissions: { type: array, items: { type: string } }
            expires_at: { type: number, nullable: true }
            view_only: { type: boolean }
            single_use: { type: boolean }
            no_terminal: { type: boolean }
            resource: { type: string, nullable: true }
            maintenance: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    ServicesResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            services: { type: array, items: { type: object } }
        error: { nullable: true }
        request_id: { type: string }
    SessionPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [sessions]
          properties:
            sessions: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
            next_cursor: { type: string, nullable: true }
            has_more: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    SessionCreatedResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [url, token_id, expires_at, role]
          properties:
            url: { type: string, description: 'fragment-carried share link' }
            token_id: { type: string }
            expires_at: { type: number }
            role: { type: string }
            permissions: { type: array, items: { type: string } }
            single_use: { type: boolean }
            view_only: { type: boolean }
            no_terminal: { type: boolean }
            max_uses: { type: integer }
            resource: { type: string, nullable: true }
            allowed_ip: { type: string, nullable: true }
            label: { type: string, nullable: true }
            emailed: { type: boolean, description: 'True when email_to was supplied and the link was delivered via ALERT_SMTP_*' }
        error: { nullable: true }
        request_id: { type: string }
    SessionRevokeResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            revoked: { description: 'bool (single) or count (revoke-all)' }
        error: { nullable: true }
        request_id: { type: string }
    SessionDetailResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [session]
          properties:
            session: { $ref: '#/components/schemas/SessionSummary' }
            connections:
              type: array
              description: Live WebSocket sockets carrying this grant
              items: { $ref: '#/components/schemas/SessionConnection' }
        error: { nullable: true }
        request_id: { type: string }
    SessionConnection:
      type: object
      properties:
        conn_id: { type: string }
        resource: { type: string, nullable: true }
        client_ip: { type: string }
        created_at:
          type: number
          description: Epoch the socket attached (duration = now - this)
    FileEntry:
      type: object
      required: [name, path, is_dir, size, mtime]
      properties:
        name: { type: string }
        path: { type: string, description: Relative path inside the share root }
        is_dir: { type: boolean }
        size: { type: integer }
        mtime: { type: number }
    FileListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [path, entries, truncated]
          properties:
            path: { type: string }
            entries: { type: array, items: { $ref: '#/components/schemas/FileEntry' } }
            truncated: { type: boolean }
            max_file_bytes: { type: integer }
            max_list_entries: { type: integer }
        error: { nullable: true }
        request_id: { type: string }
    FileWriteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            path: { type: string }
            size: { type: integer }
            mtime: { type: number }
        error: { nullable: true }
        request_id: { type: string }
    ChatMessage:
      type: object
      required: [author, at, text]
      properties:
        author:
          type: string
          description: Operator username or 'guest:<token_id>'
        at: { type: number }
        text: { type: string }
    ChatResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [session, messages]
          properties:
            session: { type: string, description: The channel's token_id }
            messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        error: { nullable: true }
        request_id: { type: string }
    ChatPostResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            message: { $ref: '#/components/schemas/ChatMessage' }
        error: { nullable: true }
        request_id: { type: string }
    FileDownloadResponse:
      type: string
      format: binary
      description: >
        Raw file bytes with Content-Disposition attachment — the one
        endpoint that does NOT answer with the {data, error} envelope.
    PowerActionResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            action: { type: string, enum: [shutdown, restart, sleep] }
            accepted: { type: boolean }
            effective_in_seconds: { type: number }
        error: { nullable: true }
        request_id: { type: string }
    WolResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            sent: { type: boolean }
            mac: { type: string }
            broadcast: { type: string }
            port: { type: integer }
        error: { nullable: true }
        request_id: { type: string }
    HealthResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { type: object }
        error: { nullable: true }
        request_id: { type: string }
    PostureCheck:
      type: object
      required: [name, status, severity, detail, evidence]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, warn, fail] }
        severity:
          type: string
          enum: [info, low, medium, high, critical]
          description: Derived from status + score weight
        detail: { type: string }
        evidence:
          type: string
          description: Observed value backing the check — never a secret
    PostureResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required:
            [score, checks, summary, deployment_decision, blocking_findings]
          properties:
            score: { type: integer, minimum: 0, maximum: 100 }
            checks:
              type: array
              items: { $ref: '#/components/schemas/PostureCheck' }
            summary: { type: string }
            summary_key:
              type: string
              enum: [excellent, good, moderate, poor]
            deployment_decision: { type: string, enum: [allowed, blocked] }
            blocking_findings: { type: array, items: { type: string } }
        error: { nullable: true }
        request_id: { type: string }
    SecurityOverviewResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            posture:
              type: object
              properties:
                score: { type: integer, nullable: true }
                summary: { type: string, nullable: true }
                summary_key: { type: string, nullable: true }
                blocking_findings:
                  type: array
                  items: { type: string }
            signals:
              type: object
              properties:
                failed_auth_24h: { type: integer }
                denied_24h: { type: integer }
                actors_with_failures:
                  type: array
                  items: { type: string }
            recent_failures:
              type: array
              items: { type: object, additionalProperties: true }
            active_sessions: { type: integer, nullable: true }
            running_jobs: { type: integer }
            maintenance: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    DoctorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { type: object }
        error: { nullable: true }
        request_id: { type: string }
    AuditPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [entries, next_cursor, has_more]
          properties:
            entries: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
            next_cursor: { type: integer, nullable: true }
            has_more: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    AuditVerifyResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            intact: { type: boolean }
            message: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    ConfigPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [vars]
          properties:
            vars: { type: array, items: { $ref: '#/components/schemas/ConfigEntry' } }
        error: { nullable: true }
        request_id: { type: string }
    BackupPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [backups]
          properties:
            backups: { type: array, items: { $ref: '#/components/schemas/BackupSummary' } }
        error: { nullable: true }
        request_id: { type: string }
    OperatorPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [operators]
          properties:
            operators: { type: array, items: { $ref: '#/components/schemas/OperatorSummary' } }
        error: { nullable: true }
        request_id: { type: string }
    OperatorResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [operator]
          properties:
            operator:
              allOf:
                - $ref: '#/components/schemas/OperatorSummary'
                - type: object
                  properties:
                    passkey_count: { type: integer }
                    deletion_allowed: { type: boolean }
                    blocking_reasons:
                      type: array
                      items: { type: string }
            changed: { type: array, items: { type: string } }
            sessions_revoked: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    PasskeyPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [passkeys]
          properties:
            passkeys:
              type: array
              items:
                type: object
                required: [ref, name, created_at, sign_count]
                properties:
                  ref: { type: string, description: 'sha256 prefix, opaque' }
                  name: { type: string }
                  created_at: { type: string }
                  sign_count: { type: integer }
        error: { nullable: true }
        request_id: { type: string }
    MaintenanceResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            active: { type: boolean }
            info: { type: object }
        error: { nullable: true }
        request_id: { type: string }
    MaintenanceSetResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [active]
          properties:
            active: { type: boolean }
            drained_now: { type: integer }
            drain_at: { type: number, nullable: true }
            info: { type: object }
        error: { nullable: true }
        request_id: { type: string }
    PortalResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [is_operator, metrics, services]
          properties:
            is_operator: { type: boolean }
            metrics: { type: object }
            services:
              type: array
              items: { type: object }
            lan_ips: { type: array, items: { type: string } }
            nginx_enabled: { type: boolean }
            nginx_https_port: { type: integer, nullable: true }
            protocol: { type: string, enum: [http, https] }
            external_base: { type: string, nullable: true }
            use_ssl: { type: boolean }
            platform: { type: string, enum: [windows, linux] }
            vnc_direct: { type: object }
            audio_ws: { type: string, nullable: true }
            gamepad_ws: { type: string, nullable: true }
            maintenance: { type: object, nullable: true }
            ports: { type: object }
            sessions:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }
            gamepad_stopped: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    SessionPreviewResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [role, expires_in_seconds]
          properties:
            role: { type: string }
            expires_in_seconds: { type: integer }
            view_only: { type: boolean }
            single_use: { type: boolean }
            no_terminal: { type: boolean }
            max_uses: { type: integer, nullable: true }
            resource: { type: string, nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    SessionActivateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [activated]
          properties:
            activated: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    GamepadStateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [gamepad_stopped]
          properties:
            gamepad_stopped: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    JobSummary:
      type: object
      required: [id, kind, actor, state, started_at]
      properties:
        id: { type: string }
        kind: { type: string }
        actor: { type: string }
        target: { type: string }
        state:
          type: string
          enum: [queued, claimed, running, done, failed]
        claimed_by: { type: string, nullable: true }
        progress: { type: string, nullable: true }
        percent: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        started_at: { type: number }
        finished_at: { type: number, nullable: true }
        detail: { type: string, nullable: true }
        error: { type: string, nullable: true }
    JobPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [jobs]
          properties:
            jobs:
              type: array
              items: { $ref: '#/components/schemas/JobSummary' }
        error: { nullable: true }
        request_id: { type: string }
    JobDetailResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [job]
          properties:
            job:
              allOf:
                - $ref: '#/components/schemas/JobSummary'
                - type: object
                  properties:
                    payload:
                      type: object
                      additionalProperties: true
        error: { nullable: true }
        request_id: { type: string }
    DeletedOperatorSummary:
      type: object
      required: [username, role, deleted_at]
      properties:
        username: { type: string }
        role: { type: string }
        created_at: { type: number, nullable: true }
        deleted_at: { type: number }
    DeletedOperatorsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted:
              type: array
              items:
                $ref: '#/components/schemas/DeletedOperatorSummary'
        error: { nullable: true }
        request_id: { type: string }
    AuthMethodsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [password, passkey]
          properties:
            password: { type: boolean }
            passkey: { type: boolean }
            mfa: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    LoginResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [operator, csrf_token, auth_method]
          properties:
            operator:
              type: object
              properties:
                username: { type: string }
                role: { type: string, nullable: true }
            csrf_token: { type: string }
            auth_method:
              type: string
              enum: [password, password+totp, password+recovery, webauthn]
        error: { nullable: true }
        request_id: { type: string }
    PasskeyAuthOptionsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [options]
          properties:
            options: { type: object }
        error: { nullable: true }
        request_id: { type: string }
    SystemUserSummary:
      type: object
      required: [username]
      properties:
        username: { type: string }
        uid: { type: integer, nullable: true }
        home: { type: string, nullable: true }
    SystemUserPageResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [users]
          properties:
            users:
              type: array
              items: { $ref: '#/components/schemas/SystemUserSummary' }
        error: { nullable: true }
        request_id: { type: string }
    SystemUserCreatedResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [username]
          properties:
            username: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    DeleteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [deleted]
          properties:
            deleted: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    LogoutResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [logged_out]
          properties:
            logged_out: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    VersionResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [version]
          properties:
            version: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    LifecycleStatusResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [services, port_health]
          properties:
            services: { type: object, additionalProperties: { $ref: '#/components/schemas/LifecycleService' } }
            port_health: { type: object, additionalProperties: { type: boolean } }
        error: { nullable: true }
        request_id: { type: string }
    LifecycleActionResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [action, accepted]
          properties:
            action: { type: string }
            job_id: { type: string }
            pid: { type: integer }
            accepted: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    BackupCreatedResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [created, name]
          properties:
            created: { type: boolean }
            name: { type: string }
            size: { type: integer, nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    BackupVerifyResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [file, ok, members]
          properties:
            file: { type: string }
            ok: { type: boolean }
            members: { type: integer }
            message: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    BackupRestoreResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [accepted, name]
          properties:
            accepted: { type: boolean }
            job_id: { type: string }
            name: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    SecretsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [secrets]
          properties:
            secrets: { type: object, additionalProperties: { type: string } }
        error: { nullable: true }
        request_id: { type: string }
    SecretRedactResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [name, redacted]
          properties:
            name: { type: string }
            redacted: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    SecretRotateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data: { $ref: '#/components/schemas/SecretRotationResult' }
        error: { nullable: true }
        request_id: { type: string }
    SigningRotateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [rotated]
          properties:
            rotated: { type: boolean }
            window_days: { type: integer }
        error: { nullable: true }
        request_id: { type: string }
    SecretsCheckResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [findings, ok]
          properties:
            findings: { type: array, items: { type: object, additionalProperties: true } }
            fixed: { type: array, items: { type: object, additionalProperties: true } }
            ok: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    RecoveryCodesResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [codes]
          properties:
            codes: { type: array, items: { type: string }, description: 'shown ONCE — only hashes persist' }
        error: { nullable: true }
        request_id: { type: string }
    ConfigExplainResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [entry]
          properties:
            entry: { $ref: '#/components/schemas/ConfigEntry' }
        error: { nullable: true }
        request_id: { type: string }
    ConfigValidateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [findings, ok]
          properties:
            profile: { type: string, nullable: true }
            findings: { type: array, items: { type: object, additionalProperties: true } }
            ok: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    ConfigDiffResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [a, b, diffs]
          properties:
            a: { type: string }
            b: { type: string }
            diffs: { type: array, items: { type: object, additionalProperties: true } }
        error: { nullable: true }
        request_id: { type: string }
    ConfigMigrateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [changes, applied]
          properties:
            changes: { type: array, items: { type: object, additionalProperties: true } }
            applied: { type: boolean }
            env_path: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    ConfigHistoryResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [snapshots]
          properties:
            snapshots:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  ts: { type: number }
                  actor: { type: string }
                  reason: { type: string }
                  size: { type: integer }
                  sha256: { type: string }
                  source: { type: string }
                  changed_keys:
                    type: array
                    items: { type: string }
                    description: 'KEY names the following mutation touched — never values'
        error: { nullable: true }
        request_id: { type: string }
    ConfigRollbackResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [restored]
          properties:
            restored: { type: string }
            target: { type: string }
            size: { type: integer }
            changed_keys:
              type: array
              items: { type: string }
              description: 'KEY names the restore flipped — never values'
            restart_job_id: { type: string, nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    UpgradeResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            current: { type: string }
            available: { type: string, nullable: true }
            update: { type: string, nullable: true }
            source: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    UpgradeRunResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [accepted, job_id]
          properties:
            accepted: { type: boolean }
            job_id: { type: string }
            source: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    UpgradeRollbackResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [accepted, job_id]
          properties:
            accepted: { type: boolean }
            job_id: { type: string }
        error: { nullable: true }
        request_id: { type: string }
    StepUpResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [stepped_up, expires_in]
          properties:
            stepped_up: { type: boolean }
            expires_in: { type: integer }
            bound:
              type: object
              nullable: true
              description: >-
                Present when the request carried operation —
                the grant is bound to that operation+resource,
                single-use, ~120s TTL.
              properties:
                operation: { type: string }
                resource: { type: string, nullable: true }
                expires_in: { type: integer }
        error: { nullable: true }
        request_id: { type: string }
    StepUpRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string }
        operation:
          type: string
          description: >-
            Catalog operation id (e.g. backup.restore) — binds the
            grant to that action; consumed once.
        resource:
          type: string
          description: >-
            Concrete target the grant binds to (backup name, secret
            name, lifecycle action). Empty = resource-less op.
    PasskeyOptionsResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [options]
          properties:
            options:
              type: object
              description: PublicKeyCredentialCreationOptions
        error: { nullable: true }
        request_id: { type: string }
    PasskeyRegisteredResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [registered]
          properties:
            registered: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    PasskeyRenamedResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          required: [renamed]
          properties:
            renamed: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    SessionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [viewer, support, operator, administrator], default: viewer }
        permissions: { type: array, items: { type: string }, maxItems: 40 }
        ttl_seconds: { type: integer, minimum: 60, maximum: 604800, default: 1800 }
        single_use: { type: boolean, default: false }
        view_only: { type: boolean, default: false }
        no_terminal: { type: boolean, default: false }
        max_uses: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        allowed_ip: { type: string, maxLength: 64, description: 'IP, CIDR or first-observed' }
        resource: { type: string, enum: [desktop, terminal, audio, gamepad, files], nullable: true }
        email_to: { type: string, maxLength: 254, nullable: true, description: 'Optional recipient — the share link is emailed via ALERT_SMTP_*' }
        label: { type: string, maxLength: 64, nullable: true, description: 'Operator tag for inventory grouping' }
    SessionUpdateRequest:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 64
          nullable: true
          description: 'Inventory tag — null clears it; omitting the key is rejected'
    SessionUpdateResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            token_id: { type: string }
            label: { type: string, nullable: true }
        error: { nullable: true }
        request_id: { type: string }
    SessionRevokeRequest:
      type: object
      required: [token_id]
      additionalProperties: false
      properties:
        token_id: { type: string, minLength: 1, maxLength: 128 }
    OperatorCreateRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 64, description: '[a-zA-Z0-9._-@]' }
        password: { type: string, minLength: 1, maxLength: 256 }
        role: { type: string, enum: [viewer, support, operator, administrator], default: viewer }
        enabled: { type: boolean, default: true }
    OperatorUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [viewer, support, operator, administrator], nullable: true }
        disabled: { type: boolean, nullable: true }
        password: { type: string, minLength: 1, maxLength: 256, nullable: true }
    PasskeyRegisterRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential: { type: object, description: 'WebAuthn attestation response' }
        name: { type: string, maxLength: 128, default: '' }
    PasskeyRenameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 128 }
    BinaryResponse:
      type: object
      description: Raw binary body (PNG image or .vrsrec stream) — no JSON envelope.
    RecordingMeta:
      type: object
      required: [id, created, operator, size, running, ended]
      properties:
        id: { type: string }
        created: { type: number }
        operator: { type: string }
        width: { type: integer }
        height: { type: integer }
        name: { type: string }
        size: { type: integer }
        running: { type: boolean }
        ended: { type: boolean }
    RecordingListResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            recordings:
              type: array
              items: { $ref: '#/components/schemas/RecordingMeta' }
        error: { nullable: true }
        request_id: { type: string }
    RecordingStartResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            running: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    RecordingStopResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            running: { type: boolean }
        error: { nullable: true }
        request_id: { type: string }
    RecordingDeleteResponse:
      type: object
      required: [data, error, request_id]
      properties:
        data:
          type: object
          properties:
            deleted: { type: string }
        error: { nullable: true }
        request_id: { type: string }
  parameters:
    csrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: >-
        HMAC bound to (vnc_op sid, vnc_csrf nonce). Obtain via GET
        /api/v1/me. Required on every mutation.

paths:
  /me:
    get:
      summary: Caller identity + session CSRF token
      x-required-permission: null
      x-ephemeral-access: true
      x-rate-limit-scope: default
      x-response-schema: MeResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { description: Not authenticated }
  /status:
    get:
      summary: Service liveness (redacted for ephemeral sessions)
      x-required-permission: null
      x-ephemeral-access: true
      x-rate-limit-scope: default
      x-response-schema: StatusResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /session-context:
    get:
      summary: Ephemeral session's own minimal context
      x-required-permission: null
      x-ephemeral-access: true
      x-rate-limit-scope: default
      x-response-schema: SessionContextResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContextResponse'
  /services:
    get:
      summary: Service cards (operator)
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: ServicesResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesResponse'
        '403': { description: Operator access required }
  /sessions:
    get:
      summary: Ephemeral sessions inventory
      x-required-permission: admin_sessions
      x-rate-limit-scope: default
      x-response-schema: SessionPageResponse
      parameters:
        - name: status
          in: query
          required: false
          description: Inventory filter — active (default), revoked, or all.
          schema:
            type: string
            enum: [active, revoked, all]
            default: active
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: cursor
          in: query
          required: false
          description: Opaque token_id cursor — returns entries after it.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPageResponse'
    post:
      summary: Create a share link
      x-required-permission: admin_sessions
      x-operation-id: session.create
      x-csrf-required: true
      x-rate-limit-scope: sessions.create
      x-request-schema: SessionCreateRequest
      x-response-schema: SessionCreatedResponse
      x-audit-event: ephemeral_session_create
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201': { description: Created }
        '400': { description: Schema violation }
        '403': { description: CSRF or capability failure }
        '429': { description: Rate limited }
  /sessions/{token_id}:
    get:
      summary: One share-link session by its public fingerprint
      x-required-permission: admin_sessions
      x-rate-limit-scope: default
      x-response-schema: SessionDetailResponse
      parameters:
        - name: token_id
          in: path
          required: true
          description: sha256 fingerprint shown by the inventory — never the token
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '403': { description: Operator access required }
        '404': { description: Unknown or reaped id }
    patch:
      summary: Edit the inventory label on a share-link session
      description: >
        Operator-facing metadata only — the label never influences
        authorization; it exists so the inventory can group links by
        purpose ("soporte Juan", "demo Q3"). `label: null` clears the
        tag; omitting the key is a malformed request. Audited as
        session_label.
      x-required-permission: admin_sessions
      x-operation-id: session.update
      x-csrf-required: true
      x-rate-limit-scope: sessions.create
      x-response-schema: SessionUpdateResponse
      x-audit-event: session_label
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: token_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUpdateResponse'
        '400': { description: label missing or invalid }
        '403': { description: Operator access required }
        '404': { description: Unknown or reaped id }
  /power:
    post:
      summary: Host power action (shutdown/restart/sleep)
      description: >
        admin:* + a step-up grant bound to power.action and the
        requested action name. The action runs on a ~1s grace delay in
        the backend so the 200 is delivered before the host drops. Each
        call is audited as power_action.
      x-required-permission: admin:*
      x-operation-id: power.action
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: power
      x-response-schema: PowerActionResponse
      x-audit-event: power_action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [shutdown, restart, sleep] }
      responses:
        '200': { description: Action accepted }
        '400': { description: Unknown action }
        '403': { description: admin:* + step-up required }
        '429': { description: Rate limited }
  /power/wol:
    post:
      summary: Wake-on-LAN magic packet
      description: >
        admin:*. Sends a WoL packet to the broadcast address (default
        255.255.255.255:9). Target is restricted to broadcast addresses.
      x-required-permission: admin:*
      x-operation-id: power.wol
      x-csrf-required: true
      x-rate-limit-scope: power
      x-response-schema: WolResponse
      x-audit-event: power_wol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mac]
              properties:
                mac: { type: string, description: 'AA:BB:CC:DD:EE:FF' }
                broadcast: { type: string, default: '255.255.255.255' }
                port: { type: integer, default: 9 }
      responses:
        '200': { description: Packet sent }
        '400': { description: Invalid MAC or non-broadcast target }
        '403': { description: admin:* required }
        '429': { description: Rate limited }
  /files:
    get:
      summary: List one directory inside the file-share root
      description: >
        Operator sessions get the share outright; ephemeral sessions
        need the file_transfer permission and a grant unbound or bound
        to the 'files' resource. Paths are relative to FILE_SHARE_ROOT
        and confined to it after realpath resolution.
      x-required-permission: session
      x-rate-limit-scope: files.list
      x-response-schema: FileListResponse
      parameters:
        - name: path
          in: query
          description: Relative directory path ('' = share root)
          schema: { type: string }
      responses:
        '200': { description: Directory listing }
        '400': { description: Invalid or escaping path }
        '403': { description: file_transfer permission required }
  /files/download:
    get:
      summary: Download one file from the share root
      description: Guests need the file_transfer permission.
      x-required-permission: session
      x-rate-limit-scope: files.download
      x-response-schema: FileDownloadResponse
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw bytes, Content-Disposition attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { description: 'Not a regular file, or over the size cap' }
  /files/upload:
    post:
      summary: Upload a file (base64 JSON body, tmp+rename write)
      description: Guests need the file_transfer permission.
      x-required-permission: session
      x-csrf-required: true
      x-rate-limit-scope: files.write
      x-response-schema: FileWriteResponse
      x-audit-event: file_transfer_upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content_b64]
              properties:
                path: { type: string, description: 'Target relative path; parent must exist' }
                content_b64: { type: string, description: 'Base64 payload, ≤32 MiB decoded' }
                overwrite: { type: boolean, default: false }
      responses:
        '201': { description: Written }
        '400': { description: Invalid path/payload }
        '403': { description: file_transfer permission required }
        '409': { description: File exists (overwrite=false) }
  /files/mkdir:
    post:
      summary: Create one directory inside the share root
      description: Guests need the file_transfer permission.
      x-required-permission: session
      x-csrf-required: true
      x-rate-limit-scope: files.write
      x-response-schema: FileWriteResponse
      x-audit-event: file_transfer_mkdir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Invalid/existing path }
  /chat:
    get:
      summary: Session chat history (guest and operator share one channel)
      description: >
        Operators pass ?session=<token_id>; guests always read their
        own grant's channel (the id is derived server-side from the
        ephemeral cookie).
      x-required-permission: session
      x-rate-limit-scope: chat
      x-response-schema: ChatResponse
      parameters:
        - name: session
          in: query
          description: token_id — operator-only parameter
          schema: { type: string }
      responses:
        '200': { description: Channel history }
    post:
      summary: Append a chat message (audited, ≤500 chars)
      x-required-permission: session
      x-csrf-required: true
      x-rate-limit-scope: chat
      x-response-schema: ChatPostResponse
      x-audit-event: session_chat_message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
                session: { type: string, description: token_id — operator only }
      responses:
        '201': { description: Posted }
        '400': { description: Empty text or inactive session }
  /sessions/revoke:
    post:
      summary: Revoke one share-link session (uniform 200)
      x-required-permission: admin_sessions
      x-operation-id: session.revoke
      x-csrf-required: true
      x-rate-limit-scope: sessions.revoke
      x-request-schema: SessionRevokeRequest
      x-response-schema: SessionRevokeResponse
      x-audit-event: portal_session_revoke
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRevokeRequest' }
      responses:
        '200':
          description: '{revoked: bool} — existence is never disclosed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
  /sessions/revoke-all:
    post:
      summary: Revoke every share-link session
      x-required-permission: admin_sessions
      x-operation-id: session.revoke_all
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: sessions.revoke-all
      x-response-schema: SessionRevokeResponse
      x-audit-event: portal_session_revoke_all
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: '{revoked: count}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
  /logout:
    post:
      summary: Revoke the operator session (vnc_op + vnc_csrf expire)
      x-required-permission: operator
      x-csrf-required: true
      x-rate-limit-scope: default
      x-response-schema: LogoutResponse
      x-audit-event: portal_logout
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Idempotent logout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /step-up:
    post:
      summary: >-
        Re-authenticate the operator password; grants ~5 min of recent
        auth for step-up-gated routes (mass revocation, operator
        lifecycle).
      x-required-permission: operator
      x-operation-id: ui.step_up
      x-csrf-required: true
      x-rate-limit-scope: stepup
      x-request-schema: StepUpRequest
      x-response-schema: StepUpResponse
      x-audit-event: step_up_granted
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUpRequest' }
      responses:
        '200': { description: Recent auth granted }
        '400': { description: Missing password }
        '403': { description: Wrong password / CSRF failure }
        '429': { description: Rate limited }
  /health:
    get:
      summary: Aggregated health (operator)
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: HealthResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /security/posture:
    get:
      summary: Security posture report (operator)
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: PostureResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostureResponse'
  /security/overview:
    get:
      summary: >-
        Security-center rollup: posture score + 24h auth/deny signals +
        live sessions + running jobs + maintenance (operator).
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: SecurityOverviewResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityOverviewResponse'
  /doctor:
    get:
      summary: Doctor checks (operator, rate limited)
      x-required-permission: operator
      x-operation-id: system.doctor
      x-rate-limit-scope: doctor
      x-response-schema: DoctorResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorResponse'
        '429': { description: Rate limited }
  /audit:
    get:
      summary: Audit log page (cursor pagination)
      x-required-permission: admin_audit
      x-rate-limit-scope: audit
      x-response-schema: AuditPageResponse
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: event
          in: query
          schema: { type: string, maxLength: 128 }
        - name: user
          in: query
          required: false
          description: Exact actor username filter.
          schema: { type: string, maxLength: 128 }
        - name: result
          in: query
          required: false
          description: Exact outcome filter (success/failure/…).
          schema: { type: string, maxLength: 128 }
        - name: cursor
          in: query
          schema: { type: integer, description: 'seq of last entry of previous page' }
      responses:
        '200':
          description: '{entries, next_cursor, has_more}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageResponse'
  /audit/verify:
    get:
      summary: Verify audit chain integrity
      x-required-permission: admin_audit
      x-rate-limit-scope: audit.verify
      x-response-schema: AuditVerifyResponse
      responses:
        '200':
          description: '{intact, message}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
  /config:
    get:
      summary: Effective config, values redacted
      x-required-permission: admin_config
      x-operation-id: config.effective
      x-rate-limit-scope: default
      x-response-schema: ConfigPageResponse
      responses:
        '200':
          description: '{vars: [ConfigEntry]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPageResponse'
  /backups:
    get:
      summary: Backup inventory (operator)
      x-required-permission: operator
      x-operation-id: backup.list
      x-rate-limit-scope: default
      x-response-schema: BackupPageResponse
      responses:
        '200':
          description: '{backups: [BackupSummary]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupPageResponse'
    post:
      summary: Create a backup archive (vnc-remote backup parity).
      x-required-permission: admin:*
      x-operation-id: backup.create
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: backups.write
      x-response-schema: BackupCreatedResponse
      x-audit-event: backup_create
      responses:
        '201': { description: '{created: true, name, size}' }
        '403': { description: Not admin:* or step-up missing }
  /operators:
    get:
      summary: Operator accounts
      x-required-permission: admin_users
      x-rate-limit-scope: default
      x-response-schema: OperatorPageResponse
      responses:
        '200':
          description: '{operators: [OperatorSummary]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorPageResponse'
    post:
      summary: Create an operator (strict schema)
      x-required-permission: admin_users
      x-operation-id: operator.create
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: operators.create
      x-request-schema: OperatorCreateRequest
      x-response-schema: OperatorResponse
      x-audit-event: operator_created
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorCreateRequest' }
      responses:
        '201': { description: Created }
        '400': { description: 'Validation failure (unknown field, weak password, bad role)' }
        '403': { description: 'admin:* required to create admin operators' }
        '409': { description: Username already taken }
  /operators/{username}:
    get:
      summary: Operator detail (record + expanded permissions + passkey count)
      x-required-permission: admin_users
      x-rate-limit-scope: default
      x-response-schema: OperatorResponse
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '404': { description: Operator not found }
    patch:
      summary: 'Edit operator: role, disabled, password. Sensitive changes revoke sessions.'
      x-required-permission: admin_users
      x-operation-id: operator.update
      x-csrf-required: true
      x-rate-limit-scope: operators.update
      x-request-schema: OperatorUpdateRequest
      x-response-schema: OperatorResponse
      x-audit-event: operator_updated
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorUpdateRequest' }
      responses:
        '200':
          description: '{operator, changed, sessions_revoked}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorResponse'
        '409': { description: 'Would remove the last viable administrator' }
    delete:
      summary: Delete an operator (last viable admin is protected)
      x-required-permission: admin_users
      x-operation-id: operator.delete
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: operators.delete
      x-response-schema: DeleteResponse
      x-audit-event: operator_deleted
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{deleted: true}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '404': { description: Operator not found }
        '409': { description: 'Would delete the last viable administrator' }
  /operators/{username}/passkeys:
    get:
      summary: 'Operator passkeys — owner or admin_users; opaque refs'
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: PasskeyPageResponse
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{passkeys: [{ref, name, created_at, sign_count}]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyPageResponse'
        '403': { description: 'Not the owner and no admin_users' }
        '404': { description: Operator not found }
  /operators/{username}/passkeys/register/begin:
    post:
      summary: 'WebAuthn registration options — self-service + step-up'
      x-required-permission: operator
      x-operation-id: passkey.register_begin
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: passkeys.register
      x-response-schema: PasskeyOptionsResponse
      x-audit-event: passkey_register_begin
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{options: PublicKeyCredentialCreationOptions}' }
        '403': { description: 'STEP_UP_REQUIRED or not the owner' }
  /operators/{username}/passkeys/register/complete:
    post:
      summary: Verify attestation and persist the passkey
      x-required-permission: operator
      x-operation-id: passkey.register_complete
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: passkeys.register
      x-request-schema: PasskeyRegisterRequest
      x-response-schema: PasskeyRegisteredResponse
      x-audit-event: passkey_registered
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRegisterRequest' }
      responses:
        '201': { description: '{registered: true}' }
        '400': { description: 'Invalid/expired/replayed challenge or bad origin/RP' }
  /operators/{username}/passkeys/{credential_ref}:
    patch:
      summary: Rename a passkey (owner or admin_users)
      x-required-permission: operator
      x-operation-id: passkey.rename
      x-csrf-required: true
      x-rate-limit-scope: passkeys.manage
      x-request-schema: PasskeyRenameRequest
      x-response-schema: PasskeyRenamedResponse
      x-audit-event: passkey_renamed
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
        - name: credential_ref
          in: path
          required: true
          schema: { type: string, description: 'sha256(credential_id)[:16]' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasskeyRenameRequest' }
      responses:
        '200': { description: '{renamed: true}' }
        '404': { description: 'Unknown ref (uniform — no oracle)' }
    delete:
      summary: 'Revoke a passkey (owner or admin_users; last-factor guarded)'
      x-required-permission: operator
      x-operation-id: passkey.revoke
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: passkeys.manage
      x-response-schema: DeleteResponse
      x-audit-event: passkey_revoked
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
        - name: credential_ref
          in: path
          required: true
          schema: { type: string, description: 'sha256(credential_id)[:16]' }
      responses:
        '200': { description: '{deleted: true}' }
        '404': { description: Unknown ref }
        '409': { description: 'Would leave the account without a usable factor' }
  /operators/{username}/sessions/revoke-all:
    post:
      summary: Revoke every live operator session for the user (per-user epoch)
      x-required-permission: admin_users
      x-operation-id: operator.sessions_revoke_all
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: operators.sessions_revoke
      x-response-schema: SessionRevokeResponse
      x-audit-event: operator_sessions_revoked
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{revoked: true}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
        '404': { description: Operator not found }
  /auth/methods:
    get:
      summary: Which login ceremonies are available (public)
      x-required-permission: public
      x-rate-limit-scope: default
      x-response-schema: AuthMethodsResponse
      responses:
        '200':
          description: '{password, passkey}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethodsResponse'
  /auth/login:
    post:
      summary: >-
        Operator password login — mints vnc_op + vnc_csrf cookies and
        returns the CSRF token. Origin + Sec-Fetch checked; rate
        limited. When MFA is required (MFA_REQUIRED + TOTP_SECRET),
        the ``totp`` field carries the TOTP or recovery code; a
        missing code answers 401 with code=MFA_REQUIRED.
      x-required-permission: public
      x-rate-limit-scope: login
      x-response-schema: LoginResponse
      x-audit-event: operator_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, maxLength: 128 }
                password: { type: string, maxLength: 512 }
                totp: { type: string, maxLength: 32 }
      responses:
        '200': { description: '{operator, csrf_token, auth_method}' }
        '400': { description: Missing/oversized credentials }
        '401': { description: Invalid credentials / MFA_REQUIRED }
        '403': { description: Cross-site request rejected }
        '429': { description: Rate limited }
  /auth/passkey/begin:
    post:
      summary: >-
        WebAuthn assertion options (public, rate-limited). Uniform
        404 for unknown user or no credentials — no enumeration.
      x-required-permission: public
      x-rate-limit-scope: passkeys.auth
      x-audit-event: passkey_auth_begin
      x-response-schema: PasskeyAuthOptionsResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: { type: string, maxLength: 128 }
      responses:
        '200': { description: '{options: PublicKeyCredentialRequestOptions}' }
        '404': { description: Passkey authentication unavailable }
  /auth/passkey/complete:
    post:
      summary: >-
        Verify the WebAuthn assertion and mint the operator session.
      x-required-permission: public
      x-rate-limit-scope: passkeys.auth
      x-response-schema: LoginResponse
      x-audit-event: operator_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, credential]
              properties:
                username: { type: string, maxLength: 128 }
                credential: { type: object }
      responses:
        '200': { description: Session issued }
        '400': { description: Missing fields }
        '401': { description: Assertion rejected }
  /jobs:
    get:
      summary: Recent destructive-operation jobs, newest first
      x-required-permission: admin_audit
      x-rate-limit-scope: default
      x-response-schema: JobPageResponse
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: '{jobs: [...]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPageResponse'
  /jobs/{jid}:
    get:
      summary: One job record, incl. progress phase and payload
      x-required-permission: admin_audit
      x-rate-limit-scope: default
      x-response-schema: JobDetailResponse
      parameters:
        - name: jid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{job}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetailResponse'
        '404': { description: Job not found }
  /operators/deleted:
    get:
      summary: >-
        Tombstoned operators (restore candidates). Snapshots are
        non-secret: role and timestamps only.
      x-required-permission: admin_users
      x-rate-limit-scope: default
      x-response-schema: DeletedOperatorsResponse
      responses:
        '200':
          description: '{deleted: [{username, role, deleted_at}]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedOperatorsResponse'
  /operators/{username}/restore:
    post:
      summary: >-
        Restore a tombstoned operator (admin_users + step-up). The
        account returns disabled with a random password — an admin
        must set a password and re-enable it explicitly.
      x-required-permission: admin_users
      x-operation-id: operator.restore
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: operators.create
      x-response-schema: OperatorResponse
      x-audit-event: operator_restored
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{operator}' }
        '404': { description: No tombstone for this username }
        '409': { description: Operator already exists }
  /system-users:
    get:
      summary: List non-reserved OS accounts (admin_users)
      x-required-permission: admin_users
      x-rate-limit-scope: default
      x-response-schema: SystemUserPageResponse
      responses:
        '200':
          description: '{users: [{username, uid, home}]}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUserPageResponse'
    post:
      summary: Create a runtime OS account (admin_users + step-up)
      x-required-permission: admin_users
      x-operation-id: system_user.create
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: system_users.manage
      x-response-schema: SystemUserCreatedResponse
      x-audit-event: user_create
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '201':
          description: '{username}'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUserCreatedResponse'
        '400': { description: Invalid username/password or unknown fields }
        '403': { description: 'Not admin_users, reserved name, or STEP_UP_REQUIRED' }
  /system-users/{username}:
    delete:
      summary: >-
        Delete a runtime OS account (admin_users + step-up).
        Reserved/builtin names and the current process account are
        refused.
      x-required-permission: admin_users
      x-operation-id: system_user.delete
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: system_users.manage
      x-response-schema: DeleteResponse
      x-audit-event: user_delete
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{deleted: true}' }
        '400': { description: Invalid username or deletion failed }
        '409': { description: Protected account (reserved/self) }
  /maintenance:
    get:
      summary: Maintenance mode state (operator)
      x-required-permission: operator
      x-rate-limit-scope: default
      x-response-schema: MaintenanceResponse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceResponse'
    post:
      summary: >-
        Toggle maintenance mode (admin:* + step-up). Optional
        immediate drain or scheduled drain_timeout for existing
        share links.
      x-required-permission: 'admin:*'
      x-operation-id: maintenance.toggle
      x-csrf-required: true
      x-step-up-required: true
      x-rate-limit-scope: maintenance
      x-response-schema: MaintenanceSetResponse
      x-audit-event: maintenance_changed
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [active]
              properties:
                active: { type: boolean }
                reason: { type: string, maxLength: 256 }
                drain: { type: boolean }
                drain_timeout:
                  { type: integer, minimum: 0, maximum: 86400 }
      responses:
        '200': { description: '{active, drained_now, drain_at, info}' }
        '400': { description: Invalid payload }
        '403': { description: 'Not admin:* or STEP_UP_REQUIRED' }
  /portal:
    get:
      summary: >-
        Portal read-model for the React portal page - services,
        metrics, LAN links, WS endpoints. Admits any authenticated
        portal identity (operator or activated share-link); operator
        viewers additionally get the session inventory and the
        gamepad kill-switch state.
      x-required-permission: session
      x-rate-limit-scope: default
      x-response-schema: PortalResponse
      responses:
        '200': { description: Portal payload }
        '401': { description: No portal session }
        '403': { description: Share session lacks portal view }
  /session/preview:
    post:
      summary: >-
        Non-consuming share-link grant summary (public - the token IS
        the credential and travels in the request body, never in a
        URL).
      x-required-permission: public
      x-rate-limit-scope: session.preview
      x-audit-event: session_preview
      x-response-schema: SessionPreviewResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
      responses:
        '200': { description: '{role, expires_in_seconds, flags}' }
        '400': { description: Missing token }
        '403': { description: 'Invalid, expired or already used' }
        '429': { description: Rate limited }
  /session/activate:
    post:
      summary: >-
        Exchange a share-link token for the vnc_ephemeral cookie
        (public, rate-limited). The cookie rides on the JSON response
        as Set-Cookie.
      x-required-permission: public
      x-rate-limit-scope: session.activate
      x-response-schema: SessionActivateResponse
      x-audit-event: ephemeral_session_activate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
      responses:
        '200': { description: '{activated: true} + Set-Cookie' }
        '400': { description: Missing token }
        '403': { description: 'Invalid, expired or already used' }
        '429': { description: Rate limited }
  /gamepad/stop:
    post:
      summary: >-
        Local kill-switch - sets the shared gamepad:stopped flag the
        gamepad service checks per connection/message.
      x-required-permission: admin_sessions
      x-operation-id: gamepad.stop
      x-csrf-required: true
      x-rate-limit-scope: default
      x-response-schema: GamepadStateResponse
      x-audit-event: portal_gamepad_stop
      responses:
        '200': { description: '{gamepad_stopped: true}' }
        '403': { description: Not an operator with admin_sessions }
  /gamepad/resume:
    post:
      summary: Clear the gamepad kill-switch flag.
      x-required-permission: admin_sessions
      x-operation-id: gamepad.resume
      x-csrf-required: true
      x-rate-limit-scope: default
      x-response-schema: GamepadStateResponse
      x-audit-event: portal_gamepad_resume
      responses:
        '200': { description: '{gamepad_stopped: false}' }
        '403': { description: Not an operator with admin_sessions }
  /version:
    get:
      summary: Installed package version (vnc-remote version parity).
      x-required-permission: session
      x-operation-id: system.version
      x-rate-limit-scope: default
      x-response-schema: VersionResponse
      responses:
        '200': { description: '{version: "x.y.z"}' }
  /lifecycle:
    get:
      summary: Managed-service PID/running map + port health (vnc-remote status parity).
      x-required-permission: operator
      x-operation-id: system.status
      x-rate-limit-scope: default
      x-response-schema: LifecycleStatusResponse
      responses:
        '200': { description: '{services, port_health}' }
        '403': { description: Not an operator }
    post:
      summary: >-
        Queue start|stop|restart on a detached runner so the response is
        delivered before the portal service itself may die.
      x-required-permission: admin:*
      x-operation-id: lifecycle.action
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: lifecycle
      x-response-schema: LifecycleActionResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart] }
      responses:
        '202': { description: '{accepted: true, pid}' }
        '400': { description: Unknown action }
        '403': { description: Not admin:* or step-up missing }
  /backups/verify:
    post:
      summary: CRC/decrypt-verify a backup by name (vnc-remote verify backup parity).
      x-required-permission: admin:*
      x-operation-id: backup.verify
      x-csrf-required: true
      x-rate-limit-scope: default
      x-response-schema: BackupVerifyResponse
      x-audit-event: backup_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, description: 'basename of a listed backup' }
      responses:
        '200': { description: '{file, ok, members, message}' }
        '404': { description: Backup not found }
  /backups/restore:
    post:
      summary: Restore a backup over the live config (vnc-remote restore parity).
      x-required-permission: admin:*
      x-operation-id: backup.restore
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: backups.write
      x-response-schema: BackupRestoreResponse
      x-audit-event: backup_restore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, description: 'basename of a listed backup' }
      responses:
        '202': { description: '{accepted, job_id, name} — claimed deferred job' }
        '404': { description: Backup not found }
  /secrets:
    get:
      summary: Per-secret status (set/missing/weak) - never values (secrets status parity).
      x-required-permission: admin:*
      x-operation-id: secrets.status
      x-rate-limit-scope: default
      x-response-schema: SecretsResponse
      responses:
        '200': { description: '{secrets: {NAME: status}}' }
  /secrets/{name}:
    get:
      summary: Fingerprinted redaction of one secret (secrets redact parity).
      x-required-permission: admin:*
      x-operation-id: secrets.redact
      x-rate-limit-scope: default
      x-response-schema: SecretRedactResponse
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{name, redacted}' }
        '400': { description: Unknown secret name }
  /secrets/{name}/rotate:
    post:
      summary: Hard-cutover rotation of an env credential (secrets rotate parity).
      x-required-permission: admin:*
      x-operation-id: secrets.rotate
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: secrets.rotate
      x-response-schema: SecretRotateResponse
      x-audit-event: secret_rotate
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{name, fingerprint, env_path, sessions_revoked}' }
        '400': { description: Non-rotatable name or .env write failed }
  /secrets/rotate-signing:
    post:
      summary: Rotate the token-signing secret with a 7-day coexistence window.
      x-required-permission: admin:*
      x-operation-id: secrets.rotate_signing
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: secrets.rotate
      x-response-schema: SigningRotateResponse
      x-audit-event: signing_key_rotate
      responses:
        '200': { description: '{rotated: true, window_days: 7}' }
  /secrets/check:
    post:
      summary: TLS config + secret-file permission findings (secrets check parity).
      x-required-permission: admin:*
      x-operation-id: secrets.check
      x-csrf-required: true
      x-rate-limit-scope: default
      x-response-schema: SecretsCheckResponse
      x-audit-event: secrets_check
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fix: { type: boolean }
      responses:
        '200': { description: '{findings, fixed, ok}' }
  /secrets/recovery-codes:
    post:
      summary: >-
        Generate MFA recovery codes - plaintext returned ONCE, only
        hashes persist (secrets recovery-codes parity).
      x-required-permission: admin:*
      x-operation-id: secrets.recovery_codes
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: secrets.rotate
      x-response-schema: RecoveryCodesResponse
      x-audit-event: recovery_codes_generate
      responses:
        '200': { description: '{codes: [...]}' }
  /config/effective:
    get:
      summary: Effective config with provenance (config show-effective parity).
      x-required-permission: admin_config
      x-rate-limit-scope: default
      x-response-schema: ConfigPageResponse
      parameters:
        - { name: profile, in: query, schema: { type: string } }
      responses:
        '200': { description: '{vars: [ConfigEntry]}' }
  /config/explain/{name}:
    get:
      summary: One variable's value + provenance (config explain parity).
      x-required-permission: admin_config
      x-operation-id: config.explain
      x-rate-limit-scope: default
      x-response-schema: ConfigExplainResponse
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{entry: ConfigEntry}' }
        '404': { description: Unknown variable }
  /config/validate:
    get:
      summary: Contradiction findings for a profile (config validate parity).
      x-required-permission: admin_config
      x-operation-id: config.validate
      x-rate-limit-scope: default
      x-response-schema: ConfigValidateResponse
      parameters:
        - { name: profile, in: query, schema: { type: string } }
      responses:
        '200': { description: '{findings, ok}' }
  /config/diff:
    get:
      summary: Value diff between two profiles (config diff parity).
      x-required-permission: admin_config
      x-operation-id: config.diff
      x-rate-limit-scope: default
      x-response-schema: ConfigDiffResponse
      parameters:
        - { name: a, in: query, required: true, schema: { type: string } }
        - { name: b, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: '{a, b, diffs}' }
  /config/migrate:
    post:
      summary: >-
        Legacy .env key/profile-value renames (config migrate parity);
        dry_run previews without writing.
      x-required-permission: admin_config
      x-operation-id: config.migrate
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: config.write
      x-response-schema: ConfigMigrateResponse
      x-audit-event: config_migrate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: { type: boolean }
      responses:
        '200': { description: '{changes, applied, env_path}' }
  /config/history:
    get:
      summary: Env-file snapshots taken before every mutation (config history parity).
      x-required-permission: admin_config
      x-operation-id: config.history
      x-rate-limit-scope: default
      x-response-schema: ConfigHistoryResponse
      responses:
        '200': { description: '{snapshots: [{id, ts, actor, reason, size, sha256, source}]}' }
  /config/rollback:
    post:
      summary: >-
        Restore an env-file snapshot over its recorded source
        (config rollback parity); the live file is snapshotted first.
      x-required-permission: admin_config
      x-operation-id: config.rollback
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: config.write
      x-response-schema: ConfigRollbackResponse
      x-audit-event: config_rollback
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [snapshot]
              additionalProperties: false
              properties:
                snapshot: { type: string, minLength: 1, maxLength: 64 }
                restart:
                  type: boolean
                  default: false
                  description: >-
                    Queue a deferred service restart so the restored
                    config takes effect (same bound grant); the
                    response carries restart_job_id.
      responses:
        '200': { description: '{restored, target, size, changed_keys, restart_job_id?}' }
  /upgrade:
    get:
      summary: Installed vs available version (upgrade --check parity).
      x-required-permission: operator
      x-operation-id: upgrade.check
      x-rate-limit-scope: default
      x-response-schema: UpgradeResponse
      responses:
        '200': { description: '{current, available, update, source}' }
    post:
      summary: Self-upgrade with automatic rollback (vnc-remote upgrade parity).
      x-required-permission: admin:*
      x-operation-id: upgrade.run
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: upgrade
      x-response-schema: UpgradeRunResponse
      x-audit-event: upgrade_run
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source: { type: string, description: 'wheel path or URL' }
      responses:
        '202': { description: '{accepted, job_id, source} — claimed deferred job' }
  /upgrade/rollback:
    post:
      summary: Restore the pre-upgrade snapshot (upgrade --rollback parity).
      x-required-permission: admin:*
      x-operation-id: upgrade.rollback
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: upgrade
      x-response-schema: UpgradeRollbackResponse
      x-audit-event: upgrade_rollback
      responses:
        '202': { description: '{accepted, job_id}' }
  /desktop/screenshot:
    get:
      summary: One PNG frame of the live host desktop
      description: >
        Opens a short shared RFB session against the loopback VNC
        server, captures a full framebuffer update and closes. Existing
        viewers are not disturbed. Audited as desktop_screenshot.
      x-required-permission: 'admin:*'
      x-operation-id: desktop.screenshot
      x-rate-limit-scope: power
      x-response-schema: BinaryResponse
      x-audit-event: desktop_screenshot
      responses:
        '200':
          description: PNG image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
        '502': { description: VNC server unreachable or auth failed }
        '429': { description: Rate limited }
  /recordings:
    get:
      summary: List desktop recordings (newest first)
      description: Metadata for every .vrsrec in the run dir.
      x-required-permission: 'admin:*'
      x-operation-id: recording.list
      x-rate-limit-scope: default
      x-response-schema: RecordingListResponse
      responses:
        '200': { description: '{recordings: [RecordingMeta]}' }
    post:
      summary: Start a background desktop recording
      description: >
        Spawns a recorder thread bound to a shared RFB session; raw
        rect stream lands in <run_dir>/recordings/<id>.vrsrec. Capped
        by VRS_RECORD_MAX_SECONDS / VRS_RECORD_MAX_BYTES.
      x-required-permission: 'admin:*'
      x-operation-id: recording.start
      x-csrf-required: true
      x-rate-limit-scope: power
      x-response-schema: RecordingStartResponse
      x-audit-event: recording_start
      responses:
        '201': { description: '{id, running: true}' }
        '403': { description: 'admin:* required' }
        '502': { description: VNC server unreachable or auth failed }
  /recordings/{id}:
    get:
      summary: Download/replay one .vrsrec recording blob
      x-required-permission: 'admin:*'
      x-operation-id: recording.get
      x-rate-limit-scope: default
      x-response-schema: BinaryResponse
      x-audit-event: recording_download
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw .vrsrec stream (rect records for the player)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Unknown recording id }
    delete:
      summary: Delete a finished recording (step-up bound)
      description: >
        Forensic data destruction — requires a step-up grant bound to
        recording.delete and the recording id.
      x-required-permission: 'admin:*'
      x-operation-id: recording.delete
      x-step-up-required: true
      x-csrf-required: true
      x-rate-limit-scope: power
      x-response-schema: RecordingDeleteResponse
      x-audit-event: recording_delete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{deleted: id}' }
        '403': { description: 'admin:* + step-up required' }
        '404': { description: Unknown recording id }
        '409': { description: Recording still running }
  /recordings/{id}/stop:
    post:
      summary: Stop a live recording cleanly
      x-required-permission: 'admin:*'
      x-operation-id: recording.stop
      x-csrf-required: true
      x-rate-limit-scope: power
      x-response-schema: RecordingStopResponse
      x-audit-event: recording_stop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{id, running: false}' }
        '404': { description: Recording not running }
