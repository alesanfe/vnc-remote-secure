openapi: 3.0.3
info:
  title: VNC Remote Secure API
  description: |
    REST API for VNC Remote Secure — a self-hosted remote access platform
    with browser-based VNC, Web Terminal, and health monitoring.

    ## Authentication
    Health, metrics, and audit endpoints accept a Bearer token
    (`HEALTH_AUTH_TOKEN`). When the token is unset, access is open only
    while every health-serving bind (`HEALTH_WEB_HOST`, `USER_UI_HOST`,
    `BIND_HOST`) is loopback — a public bind without a token fails
    closed with 401. The Flask user-management UI
    uses a `vnc_session` cookie issued by `/login` (with CSRF
    protection); that scheme is not covered by this spec and is not
    accepted by the health server. MFA (TOTP) is required for
    user-management when `MFA_REQUIRED=true`.

    ## Security
    - Backends bind to 127.0.0.1 only
    - Public access goes through nginx reverse proxy
    - All responses include security headers (HSTS, CSP, X-Frame-Options)
  version: 0.2.0
  contact:
    url: https://github.com/alesanfe/vnc-remote-secure/issues
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Linux (health service)
  - url: http://127.0.0.1:8090
    description: Windows (health service)
  - url: http://127.0.0.1:8081
    description: User-management UI (metrics and audit endpoints)
  - url: https://{domain}
    description: Public (via nginx reverse proxy)
    variables:
      domain:
        default: your-domain.duckdns.org

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Metrics
    description: Prometheus metrics export
  - name: Audit
    description: Audit log access

paths:
  /health:
    get:
      tags: [Health]
      summary: Get overall health status
      description: >-
        Returns the aggregate health of all services. The legacy aliases
        ``/health_status`` and ``/health_status.json`` return the same
        payload for backward compatibility.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Health status (healthy or degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: All services down or no data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the process is alive. No auth required.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
        '429':
          description: Rate limited (60 requests/minute per client IP)

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Returns the aggregated health status. A 200 response indicates
        the service is healthy or degraded; a 503 response indicates all
        services are down or no data is available. The body is the same
        `HealthStatus` object returned by `/health`.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Services are healthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: All services down or no data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/services:
    get:
      tags: [Health]
      summary: Per-service health
      description: |
        Returns service-manager status for every managed service.
        Each entry reports ``pid``, ``running``, ``port`` (when known)
        and ``enabled: false`` for intentionally disabled services.
        Service names: `vnc`, `novnc`, `websockify`, `terminal`,
        `health`, `landing`, `user_ui`, `audio`, `gamepad`, `nginx`.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Per-service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    pid:
                      type: integer
                      nullable: true
                    running:
                      type: boolean
                    port:
                      type: integer
                    enabled:
                      type: boolean
                example:
                  vnc: {pid: 1234, running: true, port: 5901}
                  novnc: {pid: 1235, running: true, port: 6080}
                  websockify: {pid: 1236, running: true, port: 5700}
                  terminal: {pid: 1237, running: false, port: 5000}
                  health: {pid: 1238, running: true, port: 8080}
                  landing: {pid: 1239, running: true, port: 8000}
                  user_ui: {pid: null, running: false, enabled: false, port: 8081}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health/all:
    get:
      tags: [Health]
      summary: Complete health report
      description: |
        Returns system metrics (CPU, memory, disk, uptime, hostname, OS)
        and the aggregated service health status. There is no posture
        score or top-level `status` field.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Complete health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Health status generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      description: |
        Returns metrics in Prometheus text exposition format.
        Includes service status, active sessions, auth attempts,
        TLS status, and posture score.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP vnc_remote_up Service status (1=up, 0=down)
                  # TYPE vnc_remote_up gauge
                  vnc_remote_up 1
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audit:
    get:
      tags: [Audit]
      summary: Recent audit log entries
      description: Returns recent structured audit log entries.
      security:
        - bearerToken: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
        - name: event
          in: query
          description: Filter by event type
          schema:
            type: string
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /audit/verify:
    get:
      tags: [Audit]
      summary: Verify audit log chain integrity
      description: Verifies the tamper-evident hash chain of the audit log.
      security:
        - bearerToken: []
      responses:
        '200':
          description: Chain verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  intact:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token matching the `HEALTH_AUTH_TOKEN` environment variable.
        When the token is unset, the health server accepts unauthenticated
        requests (intended for localhost-only binding).

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: boolean
          example: true
        code:
          type: string
          example: ERR_AUTH_REQUIRED
        message:
          type: string
          example: Unauthorized

    HealthStatus:
      type: object
      description: |
        Aggregated health status. `status` is `healthy` when every
        service is listening, `degraded` when some are down, `down`
        when all are down, and `unknown` when no services are configured.
        `services` maps each service name to a boolean (true = listening).
      properties:
        status:
          type: string
          enum: [healthy, degraded, down, unknown]
        services_up:
          type: integer
          example: 4
        services_total:
          type: integer
          example: 5
        services:
          type: object
          additionalProperties:
            type: boolean
          example:
            vnc: true
            novnc: true
            terminal: false
            health: true
            landing: true

    CompleteHealth:
      type: object
      description: |
        Combined system + service health snapshot. `system` contains
        best-effort resource strings (`N/A` when unavailable). `services`
        is the full `HealthStatus` object.
      properties:
        system:
          type: object
          properties:
            cpu:
              type: string
            memory:
              type: string
            disk:
              type: string
            uptime:
              type: string
            hostname:
              type: string
            os:
              type: string
        services:
          $ref: '#/components/schemas/HealthStatus'

    AuditEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        event:
          type: string
          example: login
        user:
          type: string
        ip:
          type: string
        result:
          type: string
          enum: [success, failure]
        detail:
          type: string
        hash:
          type: string
          description: SHA-256 chain hash for tamper-evidence
