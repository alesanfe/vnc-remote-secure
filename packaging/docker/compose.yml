# docker-compose.yml - VNC Remote Secure single-service deployment
# ============================================================================
# Usage:
#   docker compose --env-file .env up -d
# ============================================================================
services:
  vnc-remote:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
      # The Dockerfile's LAST stage is `test` (pytest runner) — without
      # an explicit target `docker build`/compose produces the test
      # image and the "production" container would run pytest.
      target: base
    image: vnc-remote-secure:latest
    container_name: vnc-remote
    restart: unless-stopped
    # init reaps zombie children — the service manager spawns short-lived
    # subprocesses (websockify, ttyd, ffmpeg) and PID 1 python does not
    # reap orphans, so they would accumulate over long uptimes.
    init: true
    # Prevent setuid/file-capability escalation inside the container.
    # The runtime spawns no setuid helpers, so this is pure hardening.
    security_opt:
      - no-new-privileges:true
    # Resource bounds: VNC + websockify + terminal + ffmpeg fit
    # comfortably inside these limits; a runaway process (fork bomb,
    # memory leak) degrades the container instead of the host.
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "443:443"
    # Liveness probe: /health/live is the unauthenticated probe
    # endpoint (HEALTH_WEB_PORT defaults to 8080). The health server
    # serves HTTPS when a cert resolves and plain HTTP otherwise —
    # try https first (self-signed needs -k), then http. Remove this
    # block if you disable the standalone health server
    # (HEALTH_WEB_ENABLED).
    healthcheck:
      test: ["CMD-SHELL",
             "curl -fsSk https://127.0.0.1:8080/health/live || curl -fsS http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - ../../.env
    volumes:
      # Persistent configuration (overrides defaults from the image)
      - vncrs-config:/etc/vnc-remote-secure
      # Runtime data (SSL certs, generated passwords, sessions, backups)
      - vncrs-data:/var/lib/vnc-remote-secure
      # Logs
      - vncrs-logs:/var/log/vnc-remote-secure
      # Runtime socket/pid dir (tmpfs-like, but shared with host optional)
      - vncrs-run:/run/vnc-remote-secure

volumes:
  vncrs-config:
  vncrs-data:
  vncrs-logs:
  vncrs-run:
