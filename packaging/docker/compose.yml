# docker-compose.yml - VNC Remote Secure single-service deployment
# ============================================================================
# Usage:
#   docker compose --env-file .env up -d
# ============================================================================
services:
  vnc-remote:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: vnc-remote-secure:latest
    container_name: vnc-remote
    restart: unless-stopped
    ports:
      - "443:443"
    # Liveness probe: /health/live is the unauthenticated probe
    # endpoint (HEALTH_WEB_PORT defaults to 8080). The health server
    # serves HTTPS when a cert resolves and plain HTTP otherwise —
    # try https first (self-signed needs -k), then http. Remove this
    # block if you disable the standalone health server
    # (HEALTH_WEB_ENABLED).
    healthcheck:
      test: ["CMD-SHELL",
             "curl -fsSk https://127.0.0.1:8080/health/live || curl -fsS http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - ../../.env
    volumes:
      # Persistent configuration (overrides defaults from the image)
      - vncrs-config:/etc/vnc-remote-secure
      # Runtime data (SSL certs, generated passwords, sessions, backups)
      - vncrs-data:/var/lib/vnc-remote-secure
      # Logs
      - vncrs-logs:/var/log/vnc-remote-secure
      # Runtime socket/pid dir (tmpfs-like, but shared with host optional)
      - vncrs-run:/run/vnc-remote-secure

volumes:
  vncrs-config:
  vncrs-data:
  vncrs-logs:
  vncrs-run:
