[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-remote-secure"
version = "0.2.0"
description = "Secure browser-based remote access via VNC, noVNC, and web terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "VNC Remote Secure Contributors" }
]
keywords = ["vnc", "novnc", "remote-desktop", "web-terminal", "cross-platform"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking"
]
dependencies = [
  "Flask>=3.0.3,<4.0",
  "tornado>=6.5.8,<7.0",
  "cryptography>=50.0,<52.0",
  "websockets>=12.0,<17.0",
  "websockify>=0.10,<1.0",
  "werkzeug>=3.0.3,<4.0",
  "pycryptodome>=3.19.0,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9.0",
  "pytest-cov>=4.0,<6.0",
  "ruff>=0.7.0,<1.0",
  "black>=24.0,<25.0",
  "pre-commit>=3.5,<5.0",
  "yamllint>=1.35,<2.0",
  "hypothesis>=6.100,<7.0",
  "bandit>=1.7,<2.0",
  "build>=1.0,<2.0"
]
linux = [
  "evdev>=1.0,<2.0"
]
# Optional: enables orphan-process reaping in the service manager
# (_reap_stale_service). Without it the stale-PID cleanup no-ops.
ops = [
  "psutil>=5.9,<7.0",
  "waitress>=2.1,<4.0"
]
# Browser E2E (tests/e2e/browser). After installing, run
# `python -m playwright install chromium` once to fetch the browser.
e2e = [
  "playwright>=1.40,<2.0"
]

[project.scripts]
vnc-remote = "vnc_remote_secure.cli:main"

[project.urls]
Homepage = "https://github.com/alesanfe/vnc-remote-secure"
Repository = "https://github.com/alesanfe/vnc-remote-secure"
Issues = "https://github.com/alesanfe/vnc-remote-secure/issues"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "security: security-focused tests (fuzz, adversarial)",
  "soak: long-running stability tests (deselected by default)",
  "e2e: end-to-end tests that spawn real service subprocesses"
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
# Optional/platform-specific dependencies without published type stubs.
module = ["evdev", "psutil", "waitress"]
ignore_missing_imports = true

[tool.pylint.messages_control]
# pylint complements ruff/flake8 with structural checks. Style rules and
# families already owned by ruff are disabled to avoid duplicates.
disable = [
    "C", "R",                        # convention/refactor — ruff+flake8
    "fixme", "missing-docstring",    # pydocstyle/pydoclint own docs
    "too-many-arguments", "too-many-locals", "too-many-branches",
    "too-many-statements", "too-many-instance-attributes",
    "too-few-public-methods", "too-many-public-methods",
    "broad-except", "broad-exception-caught",  # documented policy
    "global-statement",              # lazy singletons are the pattern
    "import-outside-toplevel",       # lazy imports are intentional
    "redefined-outer-name",          # lazy inner imports shadow by design
    "protected-access",              # module-internal helpers access _x
    "arguments-differ",              # stdlib/tornado override signatures
    "abstract-method",               # tornado's data_received is optional
    "attribute-defined-outside-init",# tornado WS lifecycle + ctypes fields
    "cyclic-import",
    "duplicate-code",
]

[tool.pylint.variables]
# Dispatch/interface callbacks receive a uniform signature; the handler
# may legitimately ignore some parameters.
ignored-argument-names = "args|config|session|sess|request|req|websocket|sig|frame|cwd|force|unit_file|unit_content|actor|username|project_root|as_json|writer|environ|start_response|permissions|returncode|_.*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.setuptools.package-data]
vnc_remote_secure = [
  "web/templates/*.html",
  "config/defaults/*.env",
  "config/examples/*.env.example",
  "config/schema/*.json",
  "config/nginx.conf",
  "native/linux/systemd/*.service",
  "native/linux/bin/*",
  "native/linux/README.md",
  "native/windows/*.ps1",
  "native/windows/*.psm1",
  "native/windows/*.psd1",
  "native/windows/*.md",
  "native/windows/commands/*.ps1",
  "native/windows/service/*.xml",
  "third_party/manifests/*.json",
  "third_party/licenses/*.txt",
  "third_party/checksums/*",
  "third_party/README.md",
  "static/xterm/*",
  "static/landing.css",
  "static/terminal.html"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flake8]
# flake8 runs ONLY the plugin rules ruff does not already cover.
# Base pycodestyle/pyflakes/mccabe + isort/quotes/commas are owned by
# ruff ([tool.ruff] above) — enabling both produces duplicates.
max-line-length = 110
extend-ignore = [
    "E501", "W505",                 # ruff owns line length/whitespace
    "Q000", "Q001", "Q002", "Q003", # quotes — project uses double
    "C812", "C815", "C818", "C819", # trailing commas — ruff
    "I001", "I003", "I004", "I005", # isort — lazy imports are intentional
    "NQA102", "NQA103", "NQA104",   # noqa codes target ruff, not flake8
    "WPS",                          # wemake styleguide — not adopted
    "DAR", "DCO",                   # Args/Returns — pydoclint is canonical
    "D107",                         # __init__ docstrings — see .pydocstyle
    "FNE", "ANN", "PD005", "FMT", "FA100",  # opinionated plugins
    "H101", "H102", "H104", "H105", "H106", "H201", "H202", "H204",
    "H205", "H301", "H306", "H401", "H403", "H404", "H405", "H501",
    "H601", "H702", "H803", "H903", "H904", "H905",  # hacking plugin
    "CM001", "CCR001", "C101", "CFQ", "CCE",         # complexity — xenon
    "A003", "A005",
    # pathlib preference — codebase intentionally mixes os.path/Path
    "PL100", "PL101", "PL103", "PL105", "PL107", "PL108", "PL109",
    "PL110", "PL111", "PL112", "PL113", "PL116", "PL117", "PL118",
    "PL119", "PL120", "PL123",
    "E800",  # eradicate: section comments flagged as code
    # --- reviewed during the 2024 lint sweep; not actionable here ---
    "PIE786", "PIE799", "PIE790",  # broad-except is the documented policy
    "T201", "T000",               # print/TODO are legitimate in a CLI tool
    "G200", "G201", "G100",       # logging style — exception() already used
    "LOG005", "LOG014",
    "TRY003", "TRY101", "TRY202", "TRY300", "TRY301", "TRY401",
    "VNE",                        # variables-names pedantry
    "U100", "U101",               # framework callback signatures
    "R504", "R505", "R503", "R100",  # flake8-return pedantry (singletons)
    "S",                          # bandit rules — standalone bandit is canonical
    "N400", "N8",                 # backslash continuations + Win32 API names
    "DOC301", "LN001", "LN002",   # docstring/length plugins
    "SCS100", "SCS109",           # secure-coding-style preference
    "ISC004",                     # implicit concat style
    "SIM105",                     # remaining suppress() candidates are noqa'd
    "E402",                       # lazy imports are a deliberate pattern
]
per-file-ignores = [
    "src/vnc_remote_secure/vendor/*: S, DUO, SIM, TRY, PIE, DTZ, B, N8",
    "src/vnc_remote_secure/third_party/*: ALL",
    # test docstrings are not required — test names are the documentation
    "tests/*: D",
]
exclude = [
    ".git", "__pycache__", ".venv", "venv", "build", "dist", "dist_lint",
    "node_modules", "novnc", "docs/reports", ".idea",
]

[tool.basedpyright]
# mypy is the canonical type checker; basedpyright runs in basic mode as
# a secondary signal (strict mode is not adopted — the codebase is not
# fully annotated).
typeCheckingMode = "basic"

[tool.deptry]
# CLI/test tools are dev-only deps (not imported by src/); websockify is
# spawned as a subprocess rather than imported.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "websockify", "pytest", "pytest-cov", "ruff", "black", "pre-commit",
    "yamllint", "hypothesis", "bandit", "build",
]

# darglint config lives in .darglint (it does not read pyproject.toml);
# pydocstyle config lives in .pydocstyle.

[tool.interrogate]
# Docstring coverage gate — pydocstyle handles style, this counts presence.
fail-under = 80
verbose = 0
quiet = false
exclude = ["docs", "tests", "build", "dist", "node_modules", "novnc"]
ignore-init-method = true
ignore-private = true
