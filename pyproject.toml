[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-remote-secure"
version = "0.2.0"
description = "Secure browser-based remote access via VNC, noVNC, and web terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "VNC Remote Secure Contributors" }
]
keywords = ["vnc", "novnc", "remote-desktop", "web-terminal", "cross-platform"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking"
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "cryptography>=50.0,<52.0",
  "websockets>=12.0,<17.0",
  "websockify>=0.10,<1.0",
  "pycryptodome>=3.19.0,<4.0",
  # API request/response contracts (strict mode, extra=forbid) and the
  # effective-config typed view on top of config.schema.json.
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  # Structured logging — opt-in JSON rendering on top of stdlib logging.
  "structlog>=24.4,<27.0",
  # Prometheus text exposition (cross-process values still come from
  # security.shared_state — the client only owns HELP/TYPE escaping).
  "prometheus-client>=0.21,<1.0",
  # Declarative retries for outbound integrations (webhooks, DuckDNS).
  "tenacity>=9.0,<10.0",
  # Outbound HTTP — always through security.http_client (SSRF policy +
  # DNS pinning), never raw urllib/requests.
  "httpx>=0.27,<1.0",
  # Argon2id operator password hashing (pbkdf2 legacy verify + rehash).
  "argon2-cffi>=23.1,<26.0",
  # RFC 4226/6238 primitives — the project layer keeps replay
  # protection (shared-state step claiming) on top.
  "pyotp>=2.9,<3.0",
  # Cross-process file locking (flock/msvcrt inside filelock) for the
  # service-manager global lock.
  "filelock>=3.16,<4.0",
  # .env parsing — quoting/comments/${VAR} interpolation handled by
  # the library; the project keeps the $(…)-skip and injected-default
  # precedence tracking on top.
  "python-dotenv>=1.0,<2.0",
  # Backup compression — .tar.zst written; .tar.gz still restored by
  # magic-byte detection.
  "zstandard>=0.23,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<10.0",
  "pytest-cov>=4.0,<8.0",
  "pytest-xdist>=3.6,<4.0",
  "pytest-randomly>=3.15,<4.0",
  "pytest-timeout>=2.3,<3.0",
  "pytest-repeat>=0.9,<1.0",
  "ruff>=0.7.0,<1.0",
  "black>=24.0,<26.0",
  "pre-commit>=3.5,<5.0",
  "yamllint>=1.35,<2.0",
  "hypothesis>=6.100,<7.0",
  "bandit>=1.7,<2.0",
  "build>=1.0,<2.0",
  # API contract gates: the OpenAPI YAML is schema-validated and a
  # sample of live responses is validated against it.
  "openapi-spec-validator>=0.8,<1.0",
  "openapi-core>=0.19,<1.0",
  # Formal validation of config.schema.json + shipped defaults.
  "jsonschema>=4.21,<5.0",
  # Import-boundary enforcement (engine/application cannot reach
  # security/*, domain depends on stdlib only).
  "import-linter>=2.0,<3.0",
  # Mutation testing (config in [tool.mutmut]; WSL on Windows).
  "mutmut>=3.0,<4.0",
  # Fake filesystem + deterministic clocks for config/session tests.
  "pyfakefs>=5.6,<7.0",
  "time-machine>=2.16,<4.0",
  # Supply chain: secrets scanning baseline + dependency CVE audit.
  "detect-secrets>=1.5,<2.0",
  "pip-audit>=2.7,<3.0",
  "cyclonedx-bom>=4.6,<8.0",
]
linux = [
  "evdev>=1.0,<2.0"
]
# Optional: WebAuthn/passkey ceremonies (WEBAUTHN_ENABLED + the
# /webauthn/* routes). Without it the endpoints report 503.
webauthn = [
  "webauthn>=2.0,<3.0"
]
# Optional: enables orphan-process reaping in the service manager
# (_reap_stale_service). Without it the stale-PID cleanup no-ops.
ops = [
  "psutil>=5.9,<7.0"
]
# Browser E2E (tests/e2e/browser). After installing, run
# `python -m playwright install chromium` once to fetch the browser.
e2e = [
  "playwright>=1.40,<2.0"
]
# Real XInput virtual controller on Windows (requires the ViGEmBus
# kernel driver installed separately). Without it the gamepad
# service falls back to SendInput key/mouse injection.
windows-gamepad = [
  "vgamepad>=0.1.0,<2.0"
]
# Optional: OTLP trace export (OTEL_ENABLED). monitoring/otel.py
# imports lazily and no-ops without this extra.
otel = [
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp>=1.30,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
]

[tool.mutmut]
# Mutation testing scope: start with the security-critical pure
# module — a surviving mutant in token signing means the signature
# checks tolerate behavioral change they must not. Expand
# source_paths as the baseline stabilizes (whole-package mutation
# is hours of CI).
source_paths = ["src/vnc_remote_secure/security/token_signing.py"]
# The mutant env only receives source_paths — copy the rest of the
# package unchanged so intra-package imports resolve, and point the
# runner at ONLY the relevant test file (the whole tests dir pulls
# unrelated suites whose deps may be missing).
also_copy = ["src"]
tests_dir = ["tests/unit/security/test_token_signing.py"]
runner = "python -m pytest -x -q tests/unit/security/test_token_signing.py"

[project.scripts]
vnc-remote = "vnc_remote_secure.cli:main"

[project.urls]
Homepage = "https://github.com/alesanfe/vnc-remote-secure"
Repository = "https://github.com/alesanfe/vnc-remote-secure"
Issues = "https://github.com/alesanfe/vnc-remote-secure/issues"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# pytest-timeout: no test may hang a CI worker forever — subprocess,
# WebSocket and shared-state tests occasionally block on platform
# locks. 300s is generous; genuinely slow tests use a longer
# @pytest.mark.timeout. "thread" works on Windows (no SIGALRM).
timeout = 300
timeout_method = "thread"
markers = [
  "security: security-focused tests (fuzz, adversarial)",
  "soak: long-running stability tests (deselected by default)",
  "e2e: end-to-end tests that spawn real service subprocesses"
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
# Optional/platform-specific dependencies without published type stubs.
module = ["evdev", "psutil", "vgamepad"]
ignore_missing_imports = true

[tool.pylint.messages_control]
# pylint complements ruff/flake8 with structural checks. Style rules and
# families already owned by ruff are disabled to avoid duplicates.
disable = [
    "C", "R",                        # convention/refactor — ruff+flake8
    "fixme", "missing-docstring",    # pydocstyle/pydoclint own docs
    "too-many-arguments", "too-many-locals", "too-many-branches",
    "too-many-statements", "too-many-instance-attributes",
    "too-few-public-methods", "too-many-public-methods",
    "broad-except", "broad-exception-caught",  # documented policy
    "global-statement",              # lazy singletons are the pattern
    "import-outside-toplevel",       # lazy imports are intentional
    "redefined-outer-name",          # lazy inner imports shadow by design
    "protected-access",              # module-internal helpers access _x
    "arguments-differ",              # stdlib/framework override signatures
    "abstract-method",               # framework lifecycle hooks are optional
    "attribute-defined-outside-init",# WS session lifecycle + ctypes fields
    "cyclic-import",
    "duplicate-code",
]

[tool.pylint.variables]
# Dispatch/interface callbacks receive a uniform signature; the handler
# may legitimately ignore some parameters.
ignored-argument-names = "args|config|session|sess|request|req|websocket|sig|frame|cwd|force|unit_file|unit_content|actor|username|project_root|as_json|writer|environ|start_response|permissions|returncode|_.*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.setuptools.package-data]
vnc_remote_secure = [
  "config/defaults/*.env",
  "config/examples/*.env.example",
  "config/schema/*.json",
  "config/nginx.conf",
  "native/linux/systemd/*.service",
  "native/linux/bin/*",
  "native/linux/README.md",
  "native/windows/*.ps1",
  "native/windows/*.psm1",
  "native/windows/*.psd1",
  "native/windows/*.md",
  "native/windows/commands/*.ps1",
  "native/windows/service/*.xml",
  "third_party/manifests/*.json",
  "third_party/licenses/*.txt",
  "third_party/checksums/*",
  "third_party/README.md",
  "web/static/admin/index.html",
  "web/static/admin/assets/*"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.flake8]
# flake8 runs ONLY the plugin rules ruff does not already cover.
# Base pycodestyle/pyflakes/mccabe + isort/quotes/commas are owned by
# ruff ([tool.ruff] above) — enabling both produces duplicates.
max-line-length = 110
extend-ignore = [
    "E501", "W505",                 # ruff owns line length/whitespace
    "Q000", "Q001", "Q002", "Q003", # quotes — project uses double
    "C812", "C815", "C818", "C819", # trailing commas — ruff
    "I001", "I003", "I004", "I005", # isort — lazy imports are intentional
    "NQA102", "NQA103", "NQA104",   # noqa codes target ruff, not flake8
    "WPS",                          # wemake styleguide — not adopted
    "DAR", "DCO",                   # Args/Returns — pydoclint is canonical
    "D107",                         # __init__ docstrings — see .pydocstyle
    "FNE", "ANN", "PD005", "FMT", "FA100",  # opinionated plugins
    "H101", "H102", "H104", "H105", "H106", "H201", "H202", "H204",
    "H205", "H301", "H306", "H401", "H403", "H404", "H405", "H501",
    "H601", "H702", "H803", "H903", "H904", "H905",  # hacking plugin
    "CM001", "CCR001", "C101", "CFQ", "CCE",         # complexity — xenon
    "A003", "A005",
    # pathlib preference — codebase intentionally mixes os.path/Path
    "PL100", "PL101", "PL103", "PL105", "PL107", "PL108", "PL109",
    "PL110", "PL111", "PL112", "PL113", "PL116", "PL117", "PL118",
    "PL119", "PL120", "PL123",
    "E800",  # eradicate: section comments flagged as code
    # --- reviewed during the 2024 lint sweep; not actionable here ---
    "PIE786", "PIE799", "PIE790",  # broad-except is the documented policy
    "T201", "T000",               # print/TODO are legitimate in a CLI tool
    "G200", "G201", "G100",       # logging style — exception() already used
    "LOG005", "LOG014",
    "TRY003", "TRY101", "TRY202", "TRY300", "TRY301", "TRY401",
    "VNE",                        # variables-names pedantry
    "U100", "U101",               # framework callback signatures
    "R504", "R505", "R503", "R100",  # flake8-return pedantry (singletons)
    "S",                          # bandit rules — standalone bandit is canonical
    "N400", "N8",                 # backslash continuations + Win32 API names
    "DOC301", "LN001", "LN002",   # docstring/length plugins
    "SCS100", "SCS109",           # secure-coding-style preference
    "ISC004",                     # implicit concat style
    "SIM105",                     # remaining suppress() candidates are noqa'd
    "E402",                       # lazy imports are a deliberate pattern
]
per-file-ignores = [
    "src/vnc_remote_secure/vendor/*: S, DUO, SIM, TRY, PIE, DTZ, B, N8",
    "src/vnc_remote_secure/third_party/*: ALL",
    # test docstrings are not required — test names are the documentation
    "tests/*: D",
]
exclude = [
    ".git", "__pycache__", ".venv", "venv", "build", "dist", "dist_lint",
    "node_modules", "novnc", "docs/reports", ".idea",
]

[tool.bandit]
# Standalone bandit is the canonical Python SAST pass (flake8's S rules
# are disabled so findings are not double-reported).
# Skips: B104 hardcoded bind-all (the config layer binds 0.0.0.0
# intentionally behind profiles; BIND_HOST validation lives in
# core/config.py), B311 random (secrets module is used for tokens),
# B310 urllib open (all outbound HTTP goes through the pinned
# security.http_client wrapper), B101 assert (pytest-style asserts in
# service code are intentional contract checks), B110
# try/except/pass (alerts/metrics export paths deliberately never
# raise), B404 subprocess import (the platform adapters' job),
# B105/B107 credential-name heuristics (variable names, not values),
# B603/B607 subprocess-without-shell/partial-path (the real risk is
# B602 shell=True, which stays enabled).
skips = ["B104", "B311", "B310", "B101", "B110", "B404",
         "B105", "B107", "B603", "B607"]
exclude_dirs = ["tests", "frontend", "docs", "tools", "scripts",
                "third_party", "vendor", "novnc"]

[tool.importlinter]
root_package = "vnc_remote_secure"
include_external_packages = true
# Layering contracts — these replace the hand-rolled AST scan in
# tests/unit/architecture/test_import_boundaries.py:
#   domain ← application ← infrastructure  (engine internals)
#   engine/application+domain cannot import security/monitoring/platform
#   no engine module can import transport (services/web/cli/frameworks)

[[tool.importlinter.contracts]]
name = "engine: no transport imports"
type = "forbidden"
# The rule is about DIRECT imports — transitive reach through
# infrastructure stores (which legitimately touches security/*) is
# not a boundary violation.
allow_indirect_imports = true
source_modules = ["vnc_remote_secure.engine"]
forbidden_modules = [
    "vnc_remote_secure.services",
    "vnc_remote_secure.web",
    "vnc_remote_secure.cli",
    "vnc_remote_secure.backend",
    "flask", "django", "tornado", "aiohttp", "fastapi",
    "requests", "httpx", "starlette",
    "http",
]

[[tool.importlinter.contracts]]
name = "engine/application+domain: infrastructure goes through stores"
type = "forbidden"
# Direct-import rule: application modules must reach security/monitoring/
# platform only through engine.infrastructure.stores. Transitive reach
# via stores itself is the intended path, not a violation.
allow_indirect_imports = true
source_modules = [
    "vnc_remote_secure.engine.application",
    "vnc_remote_secure.engine.domain",
]
forbidden_modules = [
    "vnc_remote_secure.security",
    "vnc_remote_secure.monitoring",
    "vnc_remote_secure.platform",
]

[[tool.importlinter.contracts]]
name = "engine layering: application -> infrastructure -> domain"
type = "layers"
allow_indirect_imports = true
layers = [
    "vnc_remote_secure.engine.application",
    "vnc_remote_secure.engine.infrastructure",
    "vnc_remote_secure.engine.domain",
]

[tool.basedpyright]
# mypy is the canonical type checker; basedpyright runs in basic mode as
# a secondary signal (strict mode is not adopted — the codebase is not
# fully annotated).
typeCheckingMode = "basic"

[tool.deptry]
# CLI/test tools are dev-only deps (not imported by src/); websockify is
# spawned as a subprocess rather than imported.
[tool.deptry.per_rule_ignores]
DEP002 = [
    "websockify", "pytest", "pytest-cov", "pytest-xdist",
    "pytest-randomly", "pytest-timeout", "pytest-repeat",
    "ruff", "black", "pre-commit", "yamllint", "hypothesis", "bandit",
    "build", "openapi-spec-validator", "openapi-core", "import-linter",
    "respx", "mutmut", "pyfakefs", "time-machine", "detect-secrets",
    "pip-audit", "cyclonedx-bom",
]

# darglint config lives in .darglint (it does not read pyproject.toml);
# pydocstyle config lives in .pydocstyle.

[tool.interrogate]
# Docstring coverage gate — pydocstyle handles style, this counts presence.
fail-under = 80
verbose = 0
quiet = false
exclude = ["docs", "tests", "build", "dist", "node_modules", "novnc"]
ignore-init-method = true
ignore-private = true
