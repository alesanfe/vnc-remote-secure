[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-remote-secure"
version = "0.2.0"
description = "Secure browser-based remote access via VNC, noVNC, and web terminal"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "VNC Remote Secure Contributors"},
]
keywords = ["vnc", "novnc", "remote-desktop", "web-terminal", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]

dependencies = [
    "Flask>=3.0.3,<4.0",
    "tornado>=6.4.2,<7.0",
    "cryptography>=41.0,<46.0",
    "websockets>=12.0,<17.0",
    "websockify>=0.10,<1.0",
    "werkzeug>=3.0.3,<4.0",
    "pycryptodome>=3.19.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-cov>=4.0,<6.0",
    "ruff>=0.7.0,<1.0",
    "black>=24.0,<25.0",
    "pre-commit>=3.5,<5.0",
    "yamllint>=1.35,<2.0",
    "hypothesis>=6.100,<7.0",
    "bandit>=1.7,<2.0",
    "build>=1.0,<2.0",
]
linux = [
    "evdev>=1.0,<2.0",
]
# Optional: enables orphan-process reaping in the service manager
# (_reap_stale_service). Without it the stale-PID cleanup no-ops.
ops = [
    "psutil>=5.9,<7.0",
]

[project.scripts]
vnc-remote = "vnc_remote_secure.cli:main"

[project.urls]
Homepage = "https://github.com/alesanfe/vnc-remote-secure"
Repository = "https://github.com/alesanfe/vnc-remote-secure"
Issues = "https://github.com/alesanfe/vnc-remote-secure/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vnc_remote_secure = [
    "web/templates/*.html",
    "config/defaults/*.env",
    "config/examples/*.env.example",
    "config/schema/*.json",
    "config/nginx.conf",
    "native/linux/systemd/*.service",
    "native/linux/bin/*",
    "native/linux/README.md",
    "native/windows/*.ps1",
    "native/windows/*.psm1",
    "native/windows/*.psd1",
    "native/windows/*.md",
    "native/windows/commands/*.ps1",
    "native/windows/service/*.xml",
    "third_party/manifests/*.json",
    "third_party/licenses/*.txt",
    "third_party/checksums/*",
    "third_party/README.md",
    "static/xterm/*",
    "static/landing.css",
    "static/terminal.html",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "security: security-focused tests (fuzz, adversarial)",
    "soak: long-running stability tests (deselected by default)",
]
