# Nginx reverse proxy for Raspberry Pi VNC Remote
# Variables substituted by envsubst: DUCK_DOMAIN, SSL_CERT, SSL_KEY,
#   NGINX_HTTP_PORT, NGINX_HTTPS_PORT,
#   NOVNC_HOST, NOVNC_PORT, TTYD_HOST, TTYD_PORT, HEALTH_WEB_HOST, HEALTH_WEB_PORT

server {
    listen ${NGINX_HTTP_PORT};
    server_name ${DUCK_DOMAIN};

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen ${NGINX_HTTPS_PORT} ssl http2;
    server_name ${DUCK_DOMAIN};

    # SSL certificates
    ssl_certificate ${SSL_CERT};
    ssl_certificate_key ${SSL_KEY};

    # Modern SSL configuration (Mozilla intermediate compatibility)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (6 months, include subdomains)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # noVNC web interface
    location /vnc/ {
        proxy_pass http://${NOVNC_HOST}:${NOVNC_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Handle noVNC websocket connections
    location /websockify {
        proxy_pass http://${NOVNC_HOST}:${NOVNC_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ttyd terminal
    location /terminal/ {
        proxy_pass http://${TTYD_HOST}:${TTYD_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check endpoint (restricted to localhost)
    location /health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://${HEALTH_WEB_HOST}:${HEALTH_WEB_PORT}/health_status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
