# Nginx reverse proxy for VNC Remote Secure
# Variables substituted at install time: DUCK_DOMAIN, SSL_CERT, SSL_KEY,
#   NGINX_HTTP_PORT, NGINX_HTTPS_PORT,
#   NOVNC_HOST, NOVNC_PORT, TTYD_HOST, TTYD_PORT,
#   HEALTH_WEB_HOST, HEALTH_WEB_PORT,
#   LANDING_HOST, LANDING_PORT,
#   AUDIO_STREAM_HOST, AUDIO_STREAM_PORT, GAMEPAD_HOST, GAMEPAD_PORT,
#   NOVNC_BACKEND_PROTOCOL, TTYD_BACKEND_PROTOCOL,
#   HEALTH_BACKEND_PROTOCOL, AUDIO_BACKEND_PROTOCOL,
#   GAMEPAD_BACKEND_PROTOCOL, LANDING_BACKEND_PROTOCOL,
#   HSTS_HEADER

server {
    listen ${NGINX_HTTP_PORT};
    server_name ${DUCK_DOMAIN};

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen ${NGINX_HTTPS_PORT} ssl http2;
    server_name ${DUCK_DOMAIN};

    # SSL certificates
    ssl_certificate ${SSL_CERT};
    ssl_certificate_key ${SSL_KEY};

    # Modern SSL configuration (Mozilla intermediate compatibility)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (1 year, include subdomains — same default as
    # http_headers.py / tls_validation.REQUIRED_SECURITY_HEADERS;
    # override via HSTS_HEADER env var)
    add_header Strict-Transport-Security "${HSTS_HEADER}" always;

    # Security headers — nginx is the canonical source at the edge.
    # The backends emit their own copies (http_headers.py), so hide
    # them or clients receive duplicates with conflicting values
    # (backend XFO=DENY vs nginx SAMEORIGIN → ambiguous policy).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # noVNC web interface
    # *_BACKEND_PROTOCOL vars resolve to "https" when the backend
    # services terminate TLS themselves (cert discovery), "http"
    # otherwise — proxying plain HTTP to a TLS backend would 502.
    location /vnc/ {
        proxy_pass ${NOVNC_BACKEND_PROTOCOL}://${NOVNC_HOST}:${NOVNC_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Handle noVNC websocket connections. NO URI in proxy_pass — a
    # trailing '/' would rewrite /websockify to / upstream, and the
    # noVNC service only enters the RFB relay for the literal
    # '/websockify' path (a rewritten request gets served vnc.html
    # instead of the WS upgrade).
    location /websockify {
        proxy_pass ${NOVNC_BACKEND_PROTOCOL}://${NOVNC_HOST}:${NOVNC_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # web terminal
    location /terminal/ {
        proxy_pass ${TTYD_BACKEND_PROTOCOL}://${TTYD_HOST}:${TTYD_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check endpoint (restricted to 127.0.0.1)
    # HEALTH_BACKEND_PROTOCOL auto-detects "https" when the backend
    # health server terminates TLS itself; the env var overrides it.
    location = /health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass ${HEALTH_BACKEND_PROTOCOL}://${HEALTH_WEB_HOST}:${HEALTH_WEB_PORT}/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health sub-paths (/health/live, /health/ready, /health/services)
    # pass through to the backend verbatim — an earlier prefix rule
    # silently remapped every sub-path to /health, so liveness/readiness
    # probes through nginx always hit the aggregate endpoint.
    location /health/ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        proxy_pass ${HEALTH_BACKEND_PROTOCOL}://${HEALTH_WEB_HOST}:${HEALTH_WEB_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional audio stream (served only when AUDIO_STREAM_ENABLED=true;
    # returns 502 otherwise — the portal does not link it when disabled)
    # AUDIO_BACKEND_PROTOCOL is "https" when the audio backend
    # terminates TLS itself (same resolution as HEALTH_BACKEND_PROTOCOL).
    location /audio/ {
        proxy_pass ${AUDIO_BACKEND_PROTOCOL}://${AUDIO_STREAM_HOST}:${AUDIO_STREAM_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Optional gamepad stream (GAMEPAD_ENABLED=true)
    # GAMEPAD_BACKEND_PROTOCOL mirrors AUDIO_BACKEND_PROTOCOL.
    location /gamepad/ {
        proxy_pass ${GAMEPAD_BACKEND_PROTOCOL}://${GAMEPAD_HOST}:${GAMEPAD_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Landing portal — service index and ephemeral share-link exchange
    # (/?session=<token>). MUST be last: it is the catch-all.
    location / {
        # The default access log writes the full request line including
        # query args — a share-link token would sit replayable in
        # access.log until expiry. Skip logging for requests that
        # carry a session arg; other portal traffic keeps logging.
        if ($arg_session) {
            access_log off;
        }
        proxy_pass ${LANDING_BACKEND_PROTOCOL}://${LANDING_HOST}:${LANDING_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

}
