<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VNC Remote Secure — secure browser-based remote access">
    <title>VNC Remote - Dashboard</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        .menu a, .menu button { margin: 10px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border: none; cursor: pointer; font-size: inherit; }
        .menu a:hover, .menu button:hover { background: #0056b3; }
        a:focus-visible, button:focus-visible {
            outline: 2px solid #0056b3; outline-offset: 2px;
        }
    </style>
</head>
<body>
    <h1>VNC Remote - User Management Dashboard</h1>
    <nav class="menu" aria-label="User management">
        <a href="{{ url_for('users.users') }}">Manage Users</a>
        <form method="post" action="{{ url_for('users.logout') }}" style="display:inline;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Logout</button>
        </form>
    </nav>
</body>
</html>
