<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="VNC Remote Secure — secure browser-based remote access">
    <title>VNC Remote - Login</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; }
        .flash, .error { padding: 10px; background: #f8d7da; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>VNC Remote - User Management</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        {% if mfa_required %}
        <input type="text" name="totp_code" placeholder="MFA code (TOTP or recovery)" autocomplete="one-time-code">
        {% endif %}
        <button type="submit">Login</button>
    </form>
</body>
</html>
