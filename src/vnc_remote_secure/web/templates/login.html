<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VNC Remote Secure — secure browser-based remote access">
    <title>VNC Remote - Login</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        label { display: block; margin: 10px 0 4px; font-weight: bold; }
        input { width: 100%; padding: 10px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; margin-top: 14px; }
        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid #0056b3; outline-offset: 2px;
        }
        .flash, .error { padding: 10px; background: #f8d7da; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>VNC Remote - User Management</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required
               autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required
               autocomplete="current-password">
        {% if mfa_required %}
        <label for="totp_code">MFA code (TOTP or recovery)</label>
        <input id="totp_code" type="text" name="totp_code"
               inputmode="numeric" autocomplete="one-time-code">
        {% endif %}
        <button type="submit">Login</button>
    </form>
    {% if webauthn_enabled %}
    <button type="button" id="passkey-btn"
            style="margin-top:12px;background:#28a745">
        Sign in with passkey
    </button>
    <div id="passkey-status" role="status" aria-live="polite"
         style="margin-top:8px;font-size:0.9em"></div>
    <script>
    (function () {
        function b64(buf) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function unb64(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            return Uint8Array.from(atob(str), function (c) {
                return c.charCodeAt(0);
            }).buffer;
        }
        var status = document.getElementById('passkey-status');
        document.getElementById('passkey-btn').addEventListener(
            'click', async function () {
                var username = document.getElementById('username').value;
                if (!username) {
                    status.textContent = 'Enter your username first.';
                    return;
                }
                try {
                    var begin = await fetch('/webauthn/assert/begin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username: username})
                    });
                    if (!begin.ok) {
                        status.textContent = 'Passkey login unavailable.';
                        return;
                    }
                    var opts = await begin.json();
                    opts.challenge = unb64(opts.challenge);
                    opts.allowCredentials = (opts.allowCredentials || [])
                        .map(function (c) {
                            return Object.assign({}, c, {id: unb64(c.id)});
                        });
                    var cred = await navigator.credentials.get(
                        {publicKey: opts});
                    var done = await fetch('/webauthn/assert/complete', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: username,
                            credential: {
                                id: cred.id,
                                rawId: b64(cred.rawId),
                                type: cred.type,
                                response: {
                                    authenticatorData: b64(cred.response.authenticatorData),
                                    clientDataJSON: b64(cred.response.clientDataJSON),
                                    signature: b64(cred.response.signature),
                                    userHandle: cred.response.userHandle
                                        ? b64(cred.response.userHandle) : null
                                }
                            }
                        })
                    });
                    if (done.redirected) {
                        window.location.href = done.url;
                    } else if (done.ok) {
                        window.location.href = '/users';
                    } else {
                        status.textContent = 'Passkey authentication failed.';
                    }
                } catch (e) {
                    status.textContent = 'Passkey authentication failed.';
                }
            });
    })();
    </script>
    {% endif %}
</body>
</html>
