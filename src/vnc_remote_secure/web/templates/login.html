<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VNC Remote Secure — secure browser-based remote access">
    <title>VNC Remote - Login</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 100px auto; padding: 20px; }
        label { display: block; margin: 10px 0 4px; font-weight: bold; }
        input { width: 100%; padding: 10px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; margin-top: 14px; }
        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: 2px solid #0056b3; outline-offset: 2px;
        }
        .flash, .error { padding: 10px; background: #f8d7da; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>VNC Remote - User Management</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash" role="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required
               autocomplete="username">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required
               autocomplete="current-password">
        {% if mfa_required %}
        <label for="totp_code">MFA code (TOTP or recovery)</label>
        <input id="totp_code" type="text" name="totp_code"
               inputmode="numeric" autocomplete="one-time-code">
        {% endif %}
        <button type="submit">Login</button>
    </form>
</body>
</html>
